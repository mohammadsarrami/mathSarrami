        :root {
            --bg-color: #f0fdf4; 
            --text-color: #000;
            --dash-color: #ef4444;
            --correct-color: #16a34a;
            --wrong-color: #dc2626;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 600px;
            padding-bottom: 100px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.8em;
            color: #14532d;
        }

        .question-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .scrambled-word {
            font-size: 1.8em; 
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            line-height: 1.4;
        }

        .dash {
            color: var(--dash-color);
            margin: 0 8px;
            display: inline-block;
        }

        input[type="text"] {
            font-family: 'CustomFont', sans-serif;
            font-size: 1.3em;
            padding: 20px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            background: #f8fafc;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #22c55e;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .feedback {
            text-align: center;
            font-size: 1em;
            min-height: 30px;
            margin-top: 10px;
            font-weight: bold;
        }
        
        .solved {
            border-color: var(--correct-color);
            background-color: #dcfce7;
        }
        
        .solved input {
            background-color: rgba(255,255,255,0.7);
            border-color: transparent;
        }

    </style>
</head>
<body>

    <div class="page-wrapper">
        <h1>🖊️ کلمات به‌هم ریخته</h1>
        <div id="quizList"></div>
    </div>

    <script>
        const questions = [{"id":0,"answer":"نخجیر","scrambled":"ی<span class=\"dash\">-</span>ج<span class=\"dash\">-</span>ر<span class=\"dash\">-</span>خ<span class=\"dash\">-</span>ن"},{"id":1,"answer":"هفت خان","scrambled":"ف<span class=\"dash\">-</span>خ<span class=\"dash\">-</span>ن<span class=\"dash\">-</span> <span class=\"dash\">-</span>ت<span class=\"dash\">-</span>ا<span class=\"dash\">-</span>ه"},{"id":2,"answer":"حیله‌گری","scrambled":"ی<span class=\"dash\">-</span>گ<span class=\"dash\">-</span>ر<span class=\"dash\">-</span>‌<span class=\"dash\">-</span>ح<span class=\"dash\">-</span>ل<span class=\"dash\">-</span>ی<span class=\"dash\">-</span>ه"}];
        const list = document.getElementById('quizList');

        // تابع یکسان‌سازی حروف (تبدیل نیم‌فاصله به فاصله معمولی)
        function normalizeText(str) {
            if (!str) return '';
            // کد یونیکد 200c همان نیم‌فاصله است
            return str.replace(/\u200c/g, ' ').trim();
        }

        questions.forEach(q => {
            const div = document.createElement('div');
            div.className = 'question-card';
            div.id = 'card-' + q.id;
            
            let html = '<div class="scrambled-word">' + q.scrambled + '</div>';
            // توجه: مقدار صحیح answer را هم پاس می‌دهیم
            html += '<input type="text" autocomplete="off" placeholder="پاسخ..." oninput="check(this, ' + q.id + ', \'' + q.answer + '\')">';
            html += '<div class="feedback" id="feedback-' + q.id + '"></div>';
            
            div.innerHTML = html;
            list.appendChild(div);
        });

        function check(input, id, originalAnswer) {
            // دریافت ورودی کاربر و استانداردسازی
            const userVal = normalizeText(input.value);
            // دریافت پاسخ صحیح و استانداردسازی
            const correctVal = normalizeText(originalAnswer);

            const feedback = document.getElementById('feedback-' + id);
            const card = document.getElementById('card-' + id);

            if (userVal === correctVal) {
                feedback.innerText = '✅ آفرین! درست نوشتی';
                feedback.style.color = 'var(--correct-color)';
                card.classList.add('solved');
                input.disabled = true;
            } else if (userVal.length >= correctVal.length) {
                // اگر طول متن به اندازه جواب رسید ولی غلط بود
                feedback.innerText = '❌ دوباره تلاش کن';
                feedback.style.color = 'var(--wrong-color)';
            } else {
                feedback.innerText = '';
            }
        }
    </script>
</body>
</html>
