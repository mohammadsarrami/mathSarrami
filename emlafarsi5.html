
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دیکته تعاملی</title>
<style>
@font-face{font-family:'Vazir';src:url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff2') format('woff2');}
body {
    font-family:'Vazir',sans-serif; background:#e0f7fa;
    margin:0; padding:0; display:flex; flex-direction:column; align-items:center;
    padding-bottom: 280px; 
    user-select: none;
}
.main-card {
    background:white; width:90%; max-width:500px; 
    margin-top:20px; padding:20px; border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15); text-align:center;
    position: relative; overflow: hidden;
}
.header-row {
    display: flex; justify-content: space-between; align-items: center;
    color: #888; font-size: 14px; margin-bottom: 10px;
}
.jump-btn {
    background: #00bcd4; color: white; border: none; border-radius: 5px;
    padding: 5px 10px; cursor: pointer; font-size: 16px;
}
.speaker-btn {
    width:80px; height:80px; background:linear-gradient(135deg, #ff9800, #f57c00);
    border-radius:50%; border:4px solid #fff; 
    box-shadow:0 8px 15px rgba(245, 124, 0, 0.4);
    color:white; font-size:35px; cursor:pointer; 
    display:flex; align-items:center; justify-content:center;
    margin: 10px auto; transition: transform 0.2s;
}
.speaker-btn:active { transform: scale(0.95); }
#wordBox {
    background: #f5f5f5; border: 2px solid #bdbdbd;
    border-radius: 15px; padding: 15px; min-height: 60px;
    margin: 20px 0; font-size: 28px; line-height: 1.5;
    text-align: right; direction: rtl; cursor: text;
    white-space: pre-wrap;
    transition: all 0.3s;
}
#wordBox.success { border-color: #4caf50; background: #e8f5e9; }
#wordBox.error { border-color: #f44336; background: #ffebee; animation: shake 0.4s; }
@keyframes shake {
  0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); }
}
.char { display: inline; cursor: pointer; color: #333; }
.cursor {
    display: inline-block; width: 2px; height: 32px; background: #000;
    vertical-align: middle; margin: 0 -1px; animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.btn-check {
    width: 100%; padding: 15px; font-size: 18px; font-weight: bold;
    border: none; border-radius: 12px; background: #4caf50; color: white;
    box-shadow: 0 4px 0 #2e7d32; cursor: pointer; margin-top: 10px;
}
.btn-check:active { transform: translateY(4px); box-shadow: none; }
#successOverlay {
    display: none; 
    margin-top: 20px;
    border-top: 2px dashed #ccc;
    padding-top: 15px;
}
@keyframes colorChange {
    0% { color: #d32f2f; transform: scale(1); }
    50% { color: #1976d2; transform: scale(1.02); }
    100% { color: #388e3c; transform: scale(1); }
}
.homework-note {
    font-weight: 900; 
    font-size: 16px; 
    line-height: 1.8;
    margin-bottom: 15px;
    text-align: center;
    padding: 10px;
    border: 2px solid gold;
    border-radius: 10px;
    background: #fffde7;
    animation: colorChange 3s infinite;
}
.btn-next {
    background: #673ab7; color: white; padding: 15px 30px;
    font-size: 20px; border-radius: 50px; border: none;
    box-shadow: 0 5px 15px rgba(103, 58, 183, 0.4);
    cursor: pointer; font-weight: bold; width: 100%;
    animation: pulse 2s infinite;
}
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(103, 58, 183, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(103, 58, 183, 0); } 100% { box-shadow: 0 0 0 0 rgba(103, 58, 183, 0); } }
#keyboard {
    position: fixed; bottom: 10px; left: 5px; right: 5px;
    background: #cfd8dc; padding: 6px; border-radius: 20px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.2); z-index: 1000;
}
.kb-row { display: flex; gap: 3px; justify-content: center; }
.key {
    flex: 1; height: 42px; background: white; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; color: #455a64;
    box-shadow: 0 3px 0 #90a4ae; cursor: pointer; min-width: 0;
}
.key:active { transform: translateY(3px); box-shadow: none; background: #eceff1; }
.key-sp { flex: 4; }
.key-del { flex: 1.5; background: #ffcdd2; color: #c62828; }

/* Jump Modal Styles */
#jumpModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 2000;
    align-items: center; justify-content: center;
}
.modal-content {
    background: white; width: 85%; max-width: 400px; padding: 20px;
    border-radius: 15px; max-height: 80vh; overflow-y: auto; text-align: center;
}
.jump-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px;
}
.jump-item {
    padding: 10px; background: #eee; border-radius: 8px; cursor: pointer;
    font-weight: bold; border: 2px solid #ddd;
}
.jump-item.current { background: #673ab7; color: white; border-color: #512da8; }
.btn-close-modal {
    margin-top: 20px; padding: 10px 20px; background: #f44336; color: white;
    border: none; border-radius: 8px; cursor: pointer;
}
</style>
</head>
<body>
<div class="main-card">
    <div class="header-row">
        <button class="jump-btn" onclick="openJumpMenu()">☰ لیست سوالات</button>
        <span id="qCounter"></span>
    </div>

    <button class="speaker-btn" onclick="playCurrentAudio()">🔊</button>
    <div id="wordBox" onclick="moveCursorToEnd()"></div>
    <button id="checkBtn" class="btn-check" onclick="checkAnswer()">بررسی کلمه ✅</button>
    <div id="successOverlay">
        <div class="homework-note" id="hwMsg"></div>
        <div style="font-size: 22px; color: green; font-weight: bold; margin-bottom: 10px;">✨ واژه درست ✨</div>
        <button class="btn-next" onclick="nextQuestion()">کلمه بعدی ⬅️</button>
    </div>
</div>

<!-- Modal for Jumping -->
<div id="jumpModal">
    <div class="modal-content">
        <h3>پرش به سوال:</h3>
        <div class="jump-grid" id="jumpGrid"></div>
        <button class="btn-close-modal" onclick="closeJumpMenu()">بستن</button>
    </div>
</div>

let currentIdx = 0;
let userChars = [];
let cursorIndex = 0;
let audioObj = new Audio();

function initGame() {
    if(currentIdx >= questions.length) {
        document.body.innerHTML = '<div class="main-card"><h1>🎉 پایان دیکته</h1><p>خسته نباشی قهرمان!</p><button class="btn-check" onclick="location.reload()">شروع مجدد</button></div>';
        return;
    }
    userChars = [];
    cursorIndex = 0;
    document.getElementById('qCounter').innerText = (currentIdx + 1) + ' / ' + questions.length;
    document.getElementById('successOverlay').style.display = 'none';
    document.getElementById('checkBtn').style.display = 'block';
    
    const kb = document.getElementById('keyboard');
    kb.style.pointerEvents = 'auto';
    kb.style.opacity = '1';
    const box = document.getElementById('wordBox');
    box.className = ''; 
    
    renderText();
    
    if(questions[currentIdx].audio) {
        audioObj.src = questions[currentIdx].audio;
    }
}

function playCurrentAudio() {
    if(questions[currentIdx].audio) {
        audioObj.currentTime = 0;
        audioObj.play();
    } else {
        alert('صدایی برای این کلمه نیست');
    }
}

function renderText() {
    const box = document.getElementById('wordBox');
    let html = '<span class="char" style="padding-left:5px;" onclick="setCursor(event, 0)">&nbsp;</span>'; 
    
    if(userChars.length === 0) {
        if(cursorIndex === 0) html += '<span class="cursor"></span>';
        html += '<span style="color:#ccc; font-size:20px;">(اینجا بنویس)</span>';
    } else {
        userChars.forEach((char, i) => {
            if(i === cursorIndex) html += '<span class="cursor"></span>';
            html += '<span class="char" onclick="setCursor(event, '+(i+1)+')">' + (char === ' ' ? '&nbsp;' : char) + '</span>';
        });
        if(cursorIndex === userChars.length) html += '<span class="cursor"></span>';
    }
    box.innerHTML = html;
}

function typeChar(char) {
    userChars.splice(cursorIndex, 0, char);
    cursorIndex++;
    renderText();
}

function delChar() {
    if(cursorIndex > 0) {
        userChars.splice(cursorIndex - 1, 1);
        cursorIndex--;
        renderText();
    }
}

function setCursor(e, idx) {
    e.stopPropagation();
    cursorIndex = idx;
    renderText();
}

function moveCursorToEnd() {
    cursorIndex = userChars.length;
    renderText();
}

function normalize(str) {
    if(!str) return "";
    return str.trim()
        .replace(/\u200c/g, " ") // تبدیل نیم فاصله به فاصله
        .replace(/ي/g, "ی").replace(/ك/g, "ک")
        .replace(/[۰-۹]/g, d => "0123456789"["۰۱۲۳۴۵۶۷۸۹".indexOf(d)])
        .replace(/\s+/g, " "); // یکی کردن فاصله‌های اضافه
}

function checkAnswer() {
    const userVal = normalize(userChars.join(''));
    const correctVal = normalize(questions[currentIdx].word);
    const box = document.getElementById('wordBox');

    if(userVal === correctVal) {
        box.classList.add('success');
        playCurrentAudio();
        document.getElementById('checkBtn').style.display = 'none';
        const kb = document.getElementById('keyboard');
        kb.style.pointerEvents = 'none';
        kb.style.opacity = '0.5';
        const cursors = document.querySelectorAll('.cursor');
        cursors.forEach(c => c.style.display = 'none');
        
        const msgDiv = document.getElementById('hwMsg');
        msgDiv.innerHTML = '❌ توجه : کلمه «' + questions[currentIdx].word + '» را در دفتر فارسی ((سه بار )) نوشته شود.<br>هر سری با ((یک رنگ )) نوشته شود .';

        document.getElementById('successOverlay').style.display = 'block';
        
    } else {
        box.classList.add('error');
        setTimeout(() => box.classList.remove('error'), 500);
        playCurrentAudio();
    }
}

function nextQuestion() {
    currentIdx++;
    initGame();
}

// Logic for Jumping
function openJumpMenu() {
    const grid = document.getElementById('jumpGrid');
    grid.innerHTML = '';
    questions.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'jump-item' + (idx === currentIdx ? ' current' : '');
        div.innerText = (idx + 1);
        div.onclick = function() {
            jumpTo(idx);
        };
        grid.appendChild(div);
    });
    document.getElementById('jumpModal').style.display = 'flex';
}

function closeJumpMenu() {
    document.getElementById('jumpModal').style.display = 'none';
}

function jumpTo(idx) {
    currentIdx = idx;
    closeJumpMenu();
    initGame();
}

initGame();
</script>
