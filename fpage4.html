            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #475569;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .score-board, .level-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #0ea5e9;
        }

        .mission-text {
            font-size: 1.4rem;
            color: #f8fafc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .highlight-max { color: #fbbf24; font-weight: bold; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); font-size: 1.6rem; }
        .highlight-min { color: #f43f5e; font-weight: bold; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); font-size: 1.6rem; }

        .equation-area {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            direction: ltr; /* فرمول ریاضی باید چپ‌چین باشد */
            margin-bottom: 40px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #475569;
        }

        .math-term {
            font-size: 2rem;
            font-weight: bold;
            color: #e2e8f0;
            /* font-family حذف شد تا فونت اصلی شما اعمال شود */
        }

        /* استایل دقیق جعبه‌های خالی مشابه تصویر کاربر */
        .sign-box {
            width: 45px;
            height: 45px;
            border: 3px solid #06b6d4;
            background: rgba(6, 182, 212, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s all;
            color: transparent;
            /* font-family حذف شد */
        }
        
        .sign-box:hover { background: rgba(6, 182, 212, 0.3); transform: scale(1.05); }
        .sign-box.is-plus { border-color: #10b981; background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .sign-box.is-minus { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .equals-sign { 
            font-size: 2rem; 
            color: #94a3b8; 
            font-weight: bold; 
            margin: 0 5px; 
            /* font-family به ارث برده می‌شود */
        }

        .answer-input {
            width: 80px;
            height: 50px;
            background: rgba(15, 23, 42, 0.8);
            border: 3px solid #64748b;
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-family: inherit; /* ارث‌بری فونت اصلی */
        }
        .answer-input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }

        .actions { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-check { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); }
        .btn-check:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.7); }
        
        .btn-next { background: linear-gradient(135deg, #10b981, #059669); display: none; }
        .btn-next:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }

        .feedback { margin-top: 20px; font-size: 1.2rem; font-weight: bold; min-height: 30px; }
        .feedback.success { color: #34d399; animation: pulse 1s infinite; }
        .feedback.error { color: #f87171; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-anim { animation: shake 0.5s; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); text-shadow: 0 0 10px #34d399; }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .math-term, .sign-box { font-size: 1.5rem; }
            .sign-box { width: 35px; height: 35px; }
            .answer-input { width: 70px; height: 40px; font-size: 1.5rem; }
            .mission-text { font-size: 1.1rem; }
            .highlight-max, .highlight-min { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameBox">
        <div class="header-bar">
            <div class="level-board" id="levelDisplay">مرحله: ۱ / ۴۰</div>
            <div class="score-board" id="scoreDisplay">امتیاز: ۰</div>
        </div>

        <div class="mission-text" id="missionText">
            در جاهای خالی علامت (+) یا (-) قرار دهید که حاصل عبارت زیر، <br>
            <span id="targetWord" class="highlight-max">بزرگ‌ترین</span> مقدار ممکن شود.
        </div>

        <div class="equation-area" id="equationArea">
            <!-- فرمول اینجا توسط جاوا اسکریپت تولید می‌شود -->
        </div>

        <div class="actions">
            <button class="btn btn-check" id="checkBtn" onclick="checkAnswer()">بررسی مأموریت</button>
            <button class="btn btn-next" id="nextBtn" onclick="loadNextLevel()">رفتن به مرحله بعد</button>
        </div>

        <div class="feedback" id="feedbackText"></div>
    </div>

    <script>
        // --- توابع کمکی ---
        const toFa = (num) => num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        const toEn = (str) => str.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

        let currentLevel = 0;
        let score = 0;
        let questions = [];
        let currentQuestion = null;

        // تولید ۴۰ سوال (۲۰ تا بیشترین، ۲۰ تا کمترین)
        function generateQuestions() {
            let types = [];
            for(let i=0; i<20; i++) { types.push('max'); types.push('min'); }
            types.sort(() => Math.random() - 0.5); // بُر زدن تصادفی

            for(let i=0; i<40; i++) {
                let gapsCount = Math.random() > 0.5 ? 3 : 4; // ۳ یا ۴ جای خالی
                let termsCount = gapsCount + 1;
                let terms = [];
                
                for(let j=0; j<termsCount; j++) {
                    terms.push(generateTerm(j === 0));
                }
                
                questions.push({
                    type: types[i],
                    terms: terms,
                    optimalValue: calculateOptimal(terms.map(t => t.val), types[i])
                });
            }
        }

        // تولید یک عدد با ۱ یا ۲ علامت تصادفی (برای پیچیدگی خواسته شده)
        function generateTerm(isFirst) {
            let num = Math.floor(Math.random() * 9) + 1; // اعداد ۱ تا ۹
            let hasMultipleSigns = Math.random() > 0.7; // ۳۰٪ احتمال داشتن علامت تو در تو
            let signCount = hasMultipleSigns ? 2 : 1;
            
            let evalVal = num;
            let str = toFa(num);
            
            for(let i=0; i<signCount; i++) {
                let s = Math.random() > 0.5 ? '+' : '-';
                if(s === '-') evalVal *= -1;
                
                if (i === 0) {
                    str = s + str;
                } else {
                    str = s + '(' + str + ')';
                }
            }
            
            // قالب بندی نهایی شبیه تصویر کاربر
            if (signCount === 1) {
                if (isFirst) {
                    str = (evalVal > 0 ? '' : '-') + toFa(Math.abs(evalVal));
                } else {
                    str = '(' + (evalVal > 0 ? '+' : '-') + toFa(Math.abs(evalVal)) + ')';
                }
            } else {
                if (!isFirst) str = '(' + str + ')';
            }
            
            return { val: evalVal, display: str };
        }

        // محاسبه جواب بهینه (بزرگترین یا کوچکترین) از طریق بررسی تمام حالت‌ها
        function calculateOptimal(nums, type) {
            let optimal = type === 'max' ? -Infinity : Infinity;
            let numBoxes = nums.length - 1;
            let totalCombos = 1 << numBoxes;
            
            for(let i=0; i<totalCombos; i++) {
                let sum = nums[0];
                for(let j=0; j<numBoxes; j++) {
                    let isMinus = (i & (1 << j)) !== 0; // بررسی بیت j برای علامت
                    sum += isMinus ? -nums[j+1] : nums[j+1];
                }
                if(type === 'max' && sum > optimal) optimal = sum;
                if(type === 'min' && sum < optimal) optimal = sum;
            }
            return optimal;
        }

        function initGame() {
            generateQuestions();
            loadLevel(0);
        }

        function loadLevel(index) {
            if(index >= 40) {
                document.getElementById('gameBox').innerHTML = `<h2 style="color:#34d399;font-size:2rem;">🎉 مأموریت با موفقیت به پایان رسید! 🎉</h2><p style="font-size:1.5rem;">امتیاز نهایی: ${score} از ۴۰</p>`;
                return;
            }

            currentLevel = index;
            currentQuestion = questions[index];
            
            document.getElementById('levelDisplay').innerText = `مرحله: ${toFa(index + 1)} / ۴۰`;
            document.getElementById('scoreDisplay').innerText = `امتیاز: ${toFa(score)}`;
            
            const targetWord = document.getElementById('targetWord');
            if(currentQuestion.type === 'max') {
                targetWord.innerText = "بزرگ‌ترین";
                targetWord.className = "highlight-max";
            } else {
                targetWord.innerText = "کوچک‌ترین";
                targetWord.className = "highlight-min";
            }

            // رندر کردن فرمول
            const eqArea = document.getElementById('equationArea');
            eqArea.innerHTML = '';
            
            currentQuestion.terms.forEach((term, i) => {
                let termDiv = document.createElement('div');
                termDiv.className = 'math-term';
                termDiv.innerText = term.display;
                eqArea.appendChild(termDiv);

                // ایجاد جاهای خالی (به جز بعد از آخرین عدد)
                if(i < currentQuestion.terms.length - 1) {
                    let box = document.createElement('div');
                    box.className = 'sign-box';
                    box.dataset.sign = '';
                    box.onclick = function() { toggleSign(this); };
                    eqArea.appendChild(box);
                }
            });

            // مساوی و کادر جواب
            let equals = document.createElement('div');
            equals.className = 'equals-sign';
            equals.innerText = '=';
            eqArea.appendChild(equals);

            let input = document.createElement('input');
            input.type = 'text';
            input.className = 'answer-input';
            input.id = 'finalAnswer';
            input.placeholder = '؟';
            input.autocomplete = "off";
            // تبدیل کیبورد فارسی به انگلیسی در هنگام تایپ برای پردازش راحت‌تر
            input.oninput = function() { this.value = toEn(this.value).replace(/[^0-9-]/g, ''); };
            eqArea.appendChild(input);

            // ریست کردن دکمه‌ها و فیدبک
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedbackText').innerText = '';
            document.getElementById('feedbackText').className = 'feedback';
        }

        // تغییر علامت با کلیک کاربر
        function toggleSign(element) {
            let current = element.dataset.sign;
            if (current === '') {
                element.dataset.sign = '+';
                element.innerText = '+';
                element.className = 'sign-box is-plus';
            } else if (current === '+') {
                element.dataset.sign = '-';
                element.innerText = '-';
                element.className = 'sign-box is-minus';
            } else {
                element.dataset.sign = '+';
                element.innerText = '+';
                element.className = 'sign-box is-plus';
            }
        }

        function checkAnswer() {
            let boxes = document.querySelectorAll('.sign-box');
            let signs = Array.from(boxes).map(b => b.dataset.sign);
            
            if(signs.includes('')) {
                showError("تکاور! هنوز همه علامت‌ها رو مشخص نکردی.");
                return;
            }

            let ansInput = document.getElementById('finalAnswer').value;
            if(ansInput.trim() === '' || isNaN(parseInt(ansInput))) {
                showError("مقدار نهایی رو تو کادر وارد کن!");
                return;
            }
            let userResult = parseInt(ansInput);

            // محاسبه جواب با توجه به علامت‌هایی که کاربر گذاشته
            let nums = currentQuestion.terms.map(t => t.val);
            let calculatedSum = nums[0];
            for(let i=0; i<signs.length; i++) {
                calculatedSum += signs[i] === '+' ? nums[i+1] : -nums[i+1];
            }

            // بررسی شرط پیروزی: ۱. جواب ریاضی درست باشد ۲. دقیقاً همان مقدار بهینه (بزرگترین/کوچکترین) باشد
            if(calculatedSum === currentQuestion.optimalValue && userResult === currentQuestion.optimalValue) {
                // جواب کاملاً درست است
                score += 10;
                document.getElementById('scoreDisplay').innerText = `امتیاز: ${toFa(score)}`;
                
                let feedback = document.getElementById('feedbackText');
                feedback.innerText = "آفرین! بهترین علامت‌ها رو انتخاب کردی و جوابت درسته! ✔️";
                feedback.className = 'feedback success';
                
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'inline-block';
                
                // غیرفعال کردن کلیک‌ها
                boxes.forEach(b => b.onclick = null);
                document.getElementById('finalAnswer').disabled = true;
            } else {
                // جواب اشتباه است (جواب درست رو نمی‌گیم تا خودش پیدا کنه)
                showError("اشتباه بود! علامت‌ها رو تغییر بده و دوباره محاسبه کن. ❌");
                // پاک کردن عدد ورودی برای تلاش مجدد
                document.getElementById('finalAnswer').value = '';
            }
        }

        function showError(msg) {
            let feedback = document.getElementById('feedbackText');
            feedback.innerText = msg;
            feedback.className = 'feedback error';
            
            let container = document.getElementById('gameBox');
            container.classList.remove('shake-anim');
            void container.offsetWidth; // ریست انیمیشن
            container.classList.add('shake-anim');
        }

        function loadNextLevel() {
            loadLevel(currentLevel + 1);
        }

        // شروع بازی پس از بارگذاری صفحه
        window.onload = initGame;
    </script>
</body>
</html>
