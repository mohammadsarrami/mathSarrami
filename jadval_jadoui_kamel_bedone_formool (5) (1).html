<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدول جادویی</title><style>
:root{--ink:#263238;--blue:#145374;--line:#38546b;--paper:#fffdf8;--green:#177245;--red:#a32929;--gold:#f2c14e}*{box-sizing:border-box}body{margin:0;background:#e8eef1;color:var(--ink);font-family:Tahoma,"Vazirmatn",sans-serif}header{background:var(--blue);color:#fff;padding:18px 20px;box-shadow:0 2px 7px #0002}header .bar{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(21px,4vw,32px);margin:0}.progress{font-size:15px;white-space:nowrap}main{max-width:980px;margin:22px auto;padding:0 14px}.sheet{background:var(--paper);border:1px solid #c9d2d7;padding:24px;box-shadow:0 3px 10px #0001}h2{font-size:20px;margin:0 0 7px}.instruction{font-size:17px;line-height:2;margin:0 0 17px}.puzzle-no{color:#1769aa;font-weight:bold;margin-bottom:12px}.grid-wrap{display:flex;justify-content:center;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(78px,120px));grid-template-rows:repeat(3,minmax(78px,120px));direction:ltr;border:3px solid var(--line)}.cell{border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;font-size:26px;font-weight:700;direction:ltr}.cell.given{background:#e4edf3;color:#203b4c}.cell input{width:100%;height:100%;border:0;background:#fffdf5;text-align:center;font:700 26px Tahoma,sans-serif;direction:ltr;color:#172b38;outline:none}.cell input:focus{background:#fff1bf;box-shadow:inset 0 0 0 3px var(--gold)}.cell input.correct{background:#d7f1df;color:var(--green)}.cell input.wrong{background:#f9dada;color:var(--red)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:4px;padding:11px 18px;font:700 15px Tahoma;cursor:pointer}.btn.primary{background:#1769aa;color:#fff}.btn.secondary{background:#d9e2e7;color:#1c3545}.note{text-align:center;min-height:28px;margin:15px 0 0;font-size:16px}.note.good{color:var(--green)}.note.bad{color:var(--red)}.end{display:none;text-align:center;padding:27px 12px;border-top:1px solid #ccd6da;margin-top:21px}.end h2{font-size:25px;margin:0 0 10px}.end p{font-size:18px;margin:0}.end.good{color:var(--green)}.end.bad{color:var(--red)}@media(max-width:500px){.sheet{padding:16px 10px}.grid{grid-template-columns:repeat(3,28vw);grid-template-rows:repeat(3,28vw)}.cell,.cell input{font-size:22px}}</style>
