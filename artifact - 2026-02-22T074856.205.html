            { word: "بعثی", target1: "دشمن", poem1: "ز دشمن نیاید جز کین و خشم<br>نباید به او دوختن هیچ چشم", target2: "دیوزاد", poem2: "دلاور چو رو در روی دشمن ایستاد<br>ز ترسش بلرزید آن دیوزاد", meanings: "توضیح: کلمه بعثی در شعر کهن نیست، شاعران به جای آن دیوزاد یا دشمن بداندیش می‌گفتند.<br>دیوزاد: زاده دیو، انسان بسیار شرور" },
            { word: "الکن", target1: "صمّ و بکم", poem1: "زبان بریده به کنجی نشسته صمّ و بکم<br>به از کسی که نباشد زبانش اندر حکم", target2: "الکن", poem2: "منطق و نطق و کلامم شد خموش<br>خرد در بیان حقایق الکن است", meanings: "صم و بکم: کر و لال<br>الکن: کسی که زبانش می‌گیرد / خرد: عقل" }
        ];

        function generateFile() {
            const fontBase64 = document.getElementById('fontInput').value.trim();
            const btn = document.getElementById('buildBtn');
            const status = document.getElementById('status');

            btn.innerText = "⏳ در حال ساخت... لطفا صبر کنید";
            
            // رفع مشکل فونت: ایجاد کد CSS قدرتمند برای تزریق فونت
            let fontCssInjection = "";
            if (fontBase64.length > 10) {
                // استخراج خالص base64 در صورتی که کاربر کد را کامل کپی نکرده باشد
                let cleanBase64 = fontBase64;
                if(fontBase64.includes('url(')) {
                     // اگر کاربر کل @font-face را کپی کرده باشد
                     fontCssInjection = fontBase64 + `\n * { font-family: 'TeacherFont', sans-serif !important; }`;
                } else {
                     // اگر فقط کد base64 را داده باشد
                     let prefix = cleanBase64.startsWith('data:') ? '' : 'data:font/woff2;base64,';
                     fontCssInjection = `
                     @font-face {
                         font-family: 'TeacherFont';
                         src: url('${prefix}${cleanBase64}');
                     }
                     * { font-family: 'TeacherFont' !important; }
                     `;
                }
            }

            // ساختن اسلایدها و اعمال سیستم "کلمه قرمز داخل شعر"
            let slidesHTML = "";
            wordsData.forEach((item, index) => {
                // تابع هوشمند برای قرمز کردن کلمه در متن شعر
                let highlightedPoem1 = item.poem1.replace(new RegExp(item.target1, 'g'), `<span class="red-target">${item.target1}</span>`);
                let highlightedPoem2 = item.poem2.replace(new RegExp(item.target2, 'g'), `<span class="red-target">${item.target2}</span>`);

                slidesHTML += `
                <div class="slide ${index === 0 ? 'active' : ''}" id="slide-${index}">
                    <div class="word-badge">لغت: ${item.word}</div>
                    
                    <div class="poem-box">
                        <div class="poem-title">🔍 سرنخ اول:</div>
                        <p class="poem-text">${highlightedPoem1}</p>
                    </div>

                    <div class="poem-box">
                        <div class="poem-title">🔍 سرنخ دوم:</div>
                        <p class="poem-text">${highlightedPoem2}</p>
                    </div>

                    <div class="meaning-box">
                        <div class="meaning-title">💡 معنی واژه‌های سخت:</div>
                        <p class="meaning-text">${item.meanings}</p>
                    </div>
                </div>
                `;
            });

            // ساختار فایل خروجی (HTML Template)
            const templateHTML = `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>کارآگاهان کلمات در شهر شعر</title>
    <style>
        /* تزریق قطعی فونت معلم */
        ${fontCssInjection}
        
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            /* سایز فونت پایه بسیار بزرگ برای کلاس */
            font-size: 35px; 
        }
        .slider-container {
            width: 95%; height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            color: #333;
            padding: 30px;
            box-sizing: border-box;
        }
        .slide {
            display: none; width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: space-between;
            animation: fadeIn 0.8s ease-in-out;
        }
        .slide.active { display: flex; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* استایل تیتر کلمه هدف */
        .word-badge {
            background: #e74c3c;
            color: white;
            padding: 15px 60px;
            border-radius: 50px;
            font-size: 3.5rem; /* بسیار بزرگ */
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.4);
            margin-bottom: 20px;
            border: 4px dashed #ffcccb;
        }

        /* استایل باکس اشعار */
        .poem-box {
            background: #fdfbfb;
            border: 3px solid #3498db;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            text-align: center;
            position: relative;
        }
        .poem-title {
            position: absolute;
            top: -25px;
            right: 30px;
            background: #3498db;
            color: white;
            padding: 5px 20px;
            border-radius: 10px;
            font-size: 1.8rem;
        }
        .poem-text {
            font-size: 3.2rem; /* فونت شعر بسیار بزرگ */
            line-height: 2;
            margin: 10px 0 0 0;
            color: #2c3e50;
        }

        /* کلمه قرمز شده در متن شعر */
        .red-target {
            color: #ff0000 !important;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,0,0,0.2);
            background: rgba(255, 255, 0, 0.3); /* هایلایت زرد ملایم زیر کلمه قرمز */
            padding: 0 10px;
            border-radius: 10px;
        }

        /* استایل باکس معنی واژگان */
        .meaning-box {
            background: #e8f8f5;
            border-right: 8px solid #1abc9c;
            width: 90%;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: right;
            box-sizing: border-box;
        }
        .meaning-title {
            color: #16a085;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .meaning-text {
            font-size: 2.2rem; /* فونت معنی کلمات */
            line-height: 1.8;
            color: #34495e;
            margin: 0;
        }

        /* دکمه‌های کنترل */
        .controls {
            width: 100%;
            display: flex; justify-content: space-between;
            margin-top: 15px;
        }
        .nav-btn {
            background: #2c3e50; color: white;
            border: none; padding: 15px 40px;
            font-size: 2rem; border-radius: 15px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .nav-btn:hover { background: #f39c12; transform: scale(1.1); }
        .counter { font-size: 2rem; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="slider-container">
        ${slidesHTML}
        
        <div class="controls">
            <button class="nav-btn" onclick="nextSlide()">اسلاید بعدی ◀</button>
            <div class="counter" id="counter">1 / ${wordsData.length}</div>
            <button class="nav-btn" onclick="prevSlide()">▶ اسلاید قبلی</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('counter');

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            slides[index].classList.add('active');
            counter.innerText = (index + 1) + " / " + slides.length;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                showSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                showSlide(currentSlide);
            }
        }
        
        // پشتیبانی از کلیدهای کیبورد برای تدریس راحت تر معلم
        document.addEventListener('keydown', function(event) {
            if(event.key === 'ArrowLeft') nextSlide();
            if(event.key === 'ArrowRight') prevSlide();
        });
    <` + `/script>
</body>
</html>`;

            // عملیات دانلود بدون باگ
            setTimeout(() => {
                const blob = new Blob([templateHTML], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Classroom_Poems_GiantFont.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                btn.innerText = "✨ فایل با موفقیت دانلود شد! ✨";
                btn.style.backgroundColor = "#8e44ad";
                status.innerText = "✅ الان می‌توانید فایل Classroom_Poems_GiantFont.html را باز کنید.";
                
                setTimeout(() => {
                    btn.innerText = "✨ ساخت و دانلود فایل کلاسی ✨";
                    btn.style.backgroundColor = "#27ae60";
                }, 4000);
            }, 1000);
        }
    </script>
</body>
</html>
