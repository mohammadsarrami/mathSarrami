<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چالش محاسبه ذهنی ریاضی</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: row;
            width: 90%;
            max-width: 900px;
            overflow: hidden;
        }
        .quiz-panel {
            flex: 1 1 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .image-panel {
            flex: 1 1 50%;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .image-panel img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 24px;
            color: #1e3c72;
            margin-bottom: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
        }
        .score-pos { color: green; }
        .score-neg { color: red; }
        
        .math-expr {
            font-size: 32px;
            font-weight: bold;
            direction: ltr; 
            unicode-bidi: embed;
            margin-bottom: 30px;
            color: #222;
            background: #eef2f3;
            padding: 15px 30px;
            border-radius: 15px;
            border: 2px dashed #1e3c72;
        }
        input[type="number"] {
            font-size: 24px;
            padding: 10px;
            width: 150px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            direction: ltr;
        }
        input[type="number"]:focus {
            border-color: #1e3c72;
            outline: none;
        }
        button {
            background-color: #1e3c72;
            color: white;
            font-size: 18px;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2a5298;
        }
        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .image-panel, .quiz-panel { width: 100%; flex: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- بخش سوالات (سمت راست) -->
    <div class="quiz-panel">
        <h1>چالش محاسبه ذهنی ریاضی</h1>
        
        <div class="score-board">
            <div class="score-pos">امتیاز مثبت: <span id="posScore">0</span></div>
            <div class="score-neg">امتیاز منفی: <span id="negScore">0</span></div>
        </div>

        <div class="math-expr" id="question"></div>
        
        <input type="number" id="answerInput" placeholder="؟" autocomplete="off">
        
        <button onclick="checkAnswer()">بررسی جواب</button>
        
        <div class="feedback" id="feedbackMsg"></div>
    </div>

<script>
    let currentAnswer = 0;
    let posScore = 0;
    let negScore = 0;

    function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function rndNonZero1(min, max) { 
        let n = rnd(min, max); 
        while(n === 0 || Math.abs(n) === 1) n = rnd(min, max); 
        return n; 
    }

    function generateQuestion() {
        const types = [1, 2]; 
        let qType = rnd(1, 2);
        let expr = "";
        
        if (qType === 1) {
            let a = rnd(-10, 10);
            let b = rndNonZero1(-5, 5);
            let c = rndNonZero1(-5, 5);
            currentAnswer = a + (b * c);
            expr = a.toString() + (b >= 0 ? " + " : " - ") + Math.abs(b).toString() + " &times; " + c.toString();
        } else {
            let a = rndNonZero1(-5, 5);
            let b = rndNonZero1(-5, 5);
            let c = rnd(-10, 10);
            currentAnswer = (a * b) - c;
            expr = a.toString() + " &times; " + b.toString() + (c >= 0 ? " - " : " + ") + Math.abs(c).toString();
        }

        document.getElementById("question").innerHTML = expr;
        document.getElementById("answerInput").value = "";
        document.getElementById("answerInput").focus();
        document.getElementById("feedbackMsg").innerText = "";
    }

    function checkAnswer() {
        let inputVal = parseInt(document.getElementById("answerInput").value);
        let fb = document.getElementById("feedbackMsg");
        
        if (isNaN(inputVal)) {
            fb.innerText = "لطفاً یک عدد وارد کن!";
            fb.style.color = "orange";
            return;
        }

        if (inputVal === currentAnswer) {
            posScore++;
            document.getElementById("posScore").innerText = posScore;
            fb.innerText = "آفرین! درست بود.";
            fb.style.color = "green";
            setTimeout(generateQuestion, 1000); // مکث کوتاه برای دیدن پیام موفقیت و بعد سوال جدید
        } else {
            negScore++;
            document.getElementById("negScore").innerText = negScore;
            fb.innerText = "اشتباه بود! دوباره تلاش کن.";
            fb.style.color = "red";
            document.getElementById("answerInput").value = "";
            document.getElementById("answerInput").focus();
        }
    }

    document.getElementById("answerInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            checkAnswer();
        }
    });

    // تولید اولین سوال
    generateQuestion();
</script>
