<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>پروتکل تقاطع | Intersection Protocol</title>
  <!-- فونت فارسی وزیرمتن با پس‌افت تمیز -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       پالت تاریک تاکتیکی و تنظیمات پایه تمام‌صفحه
       ========================================================================= */
    :root {
      --bg-void: #070b14;
      --panel-bg: rgba(15, 23, 42, 0.78);
      --panel-solid: rgba(15, 23, 42, 0.92);
      --border-cyan: rgba(34, 211, 238, 0.28);
      --border-subtle: rgba(148, 163, 184, 0.2);
      --cyan: #22d3ee;
      --emerald: #a3e635;
      --amber: #facc15;
      --danger: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', system-ui, sans-serif;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #canvas.can-grab { cursor: grab; }
    #canvas.dragging { cursor: grabbing; }

    .hidden { display: none !important; }

    /* افکت لرزش و هشدار قرمز تمام‌صفحه هنگام خطا */
    #appShell {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #appShell.alert-shake {
      animation: screenShake 0.34s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    #damageVignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 48%, rgba(244, 63, 94, 0.42) 100%);
      transition: opacity 0.28s ease;
    }

    #damageVignette.flash {
      opacity: 1;
    }

    #overclockVignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      box-shadow: inset 0 0 70px rgba(244, 63, 94, 0.24);
      transition: opacity 0.3s ease;
    }

    #overclockVignette.active {
      opacity: 1;
    }

    /* لایه رابط کاربری */
    .ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .pointer-auto { pointer-events: auto; }

    /* =========================================================================
       صفحه‌های رویه (شروع و گزارش نهایی عملیات)
       ========================================================================= */
    .overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(5, 9, 18, 0.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.24s ease;
    }

    .tac-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(165deg, rgba(15, 23, 42, 0.93) 0%, rgba(9, 14, 28, 0.96) 100%);
      border-radius: 22px;
      padding: 26px 24px 22px;
      border: 1px solid var(--border-cyan);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(34, 211, 238, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tac-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 12px;
      direction: ltr;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: dotPulse 1.6s infinite;
    }

    .tac-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 0 24px rgba(34, 211, 238, 0.22);
    }

    .tac-sub {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 20px;
      line-height: 1.65;
    }

    .mode-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-tac {
      width: 100%;
      border-radius: 14px;
      padding: 13px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.14s ease, box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
    }

    .btn-tac:active { transform: scale(0.98); }

    .btn-tac-primary {
      border: 1px solid rgba(34, 211, 238, 0.6);
      color: #04131c;
      background: linear-gradient(135deg, #22d3ee 0%, #38bdf8 55%, #a3e635 100%);
      box-shadow: 0 10px 28px rgba(34, 211, 238, 0.25);
    }

    .btn-tac-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(34, 211, 238, 0.36);
    }

    .btn-tac-rush {
      border: 1px solid rgba(250, 204, 21, 0.42);
      color: #fef08a;
      background: rgba(250, 204, 21, 0.09);
    }

    .btn-tac-rush:hover {
      background: rgba(250, 204, 21, 0.16);
      border-color: rgba(250, 204, 21, 0.72);
      transform: translateY(-1px);
    }

    .btn-tac-ghost {
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      background: rgba(30, 41, 59, 0.55);
    }

    .btn-tac-ghost:hover {
      background: rgba(51, 65, 85, 0.7);
      border-color: rgba(148, 163, 184, 0.48);
      transform: translateY(-1px);
    }

    .btn-tag {
      font-size: 11.5px;
      font-weight: 700;
      opacity: 0.85;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
    }

    .start-meta {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    .start-meta strong {
      color: var(--amber);
      font-weight: 800;
    }

    /* گزارش پایان عملیات / Game Over */
    .rank-orb {
      width: 74px;
      height: 74px;
      margin: 0 auto 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      direction: ltr;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(163, 230, 53, 0.18));
      border: 1.5px solid var(--cyan);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.26);
    }

    .rank-orb.rank-s {
      border-color: var(--amber);
      color: var(--amber);
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.2), rgba(249, 115, 22, 0.15));
      box-shadow: 0 0 34px rgba(250, 204, 21, 0.34);
    }

    .rank-orb.rank-fail {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(244, 63, 94, 0.14);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.28);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin: 16px 0 18px;
    }

    .stat-cell {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 13px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 3px;
    }

    .stat-val {
      font-size: 19px;
      font-weight: 900;
      color: #f8fafc;
    }

    .stat-val.accent-cyan { color: var(--cyan); }
    .stat-val.accent-amber { color: var(--amber); }
    .stat-val.accent-lime { color: var(--emerald); }

    /* =========================================================================
       نوار وضعیت تاکتیکی بالا (HUD)
       ========================================================================= */
    .game-hud {
      position: fixed;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      pointer-events: none;
    }

    .hud-top-row {
      width: 100%;
      max-width: 980px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .hud-chip {
      height: 36px;
      padding: 0 12px;
      border-radius: 11px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #f1f5f9;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .hud-chip.stage-chip {
      border-color: rgba(34, 211, 238, 0.36);
      color: #e0f2fe;
    }

    .hud-chip.combo-chip {
      border-color: rgba(250, 204, 21, 0.52);
      background: rgba(250, 204, 21, 0.14);
      color: var(--amber);
      animation: popIn 0.2s ease;
    }

    .shields-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .shield-cell {
      width: 14px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.65));
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .shield-cell.lost {
      opacity: 0.2;
      color: #64748b;
      filter: none;
    }

    .shield-cell.repaired {
      animation: shieldFlash 0.55s ease;
    }

    /* نوار مأموریت و تایمر خطی */
    .mission-strip {
      pointer-events: auto;
      width: 100%;
      max-width: 680px;
      background: var(--panel-solid);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-cyan);
      border-radius: 14px;
      padding: 8px 16px 7px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s ease;
    }

    .mission-strip.overclock-on {
      border-color: rgba(244, 63, 94, 0.72);
      box-shadow: 0 10px 30px rgba(244, 63, 94, 0.22);
    }

    .mission-strip.success-hit {
      border-color: var(--emerald);
      box-shadow: 0 0 26px rgba(163, 230, 53, 0.26);
    }

    .mission-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .mission-text {
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.4;
      text-align: right;
    }

    .mission-timer-num {
      font-size: 13px;
      font-weight: 900;
      color: var(--cyan);
      direction: ltr;
      min-width: 40px;
      text-align: left;
    }

    .mission-timer-num.urgent {
      color: var(--danger);
    }

    .timer-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--emerald));
      transition: background-color 0.2s ease;
      transform-origin: right center;
    }

    .timer-fill.warn {
      background: linear-gradient(90deg, #f97316, var(--amber));
    }

    .timer-fill.urgent {
      background: linear-gradient(90deg, #e11d48, #fb7185);
    }

    /* =========================================================================
       داک پایین عملیات (لغزنده تاکتیکی یا کیپد رمزگشایی + قدرت‌ها)
       ========================================================================= */
    .game-bottom-dock {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .tactical-actions-row {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .power-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .power-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .power-btn:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    .power-btn.scan-ready {
      border-color: rgba(34, 211, 238, 0.55);
      color: #67e8f9;
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.16);
    }

    .power-btn.overclock-armed {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.22);
      color: #fda4af;
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.28);
    }

    /* پنل لغزنده چرخش تقاطع */
    .rotate-dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px 9px 14px;
      border-radius: 16px;
      background: var(--panel-solid);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .slider-ltr {
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .step-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .step-btn:active { transform: scale(0.92); }

    .tac-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 210px;
      height: 28px;
      background: transparent;
      cursor: pointer;
      outline: none;
    }

    .tac-slider::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(163, 230, 53, 0.75), rgba(34, 211, 238, 0.9), rgba(250, 204, 21, 0.85));
    }

    .tac-slider::-moz-range-track {
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(163, 230, 53, 0.75), rgba(34, 211, 238, 0.9), rgba(250, 204, 21, 0.85));
    }

    .tac-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -8.5px;
      border-radius: 50%;
      background: #0f172a;
      border: 2.5px solid var(--cyan);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.75), inset 0 0 0 3px rgba(34, 211, 238, 0.25);
      transition: transform 0.12s ease;
    }

    .tac-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0f172a;
      border: 2.5px solid var(--cyan);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.75);
      transition: transform 0.12s ease;
    }

    .tac-slider:hover::-webkit-slider-thumb,
    .tac-slider:active::-webkit-slider-thumb {
      transform: scale(1.15);
    }

    .btn-lock {
      height: 38px;
      padding: 0 18px;
      border: none;
      border-radius: 11px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      color: #03151e;
      background: linear-gradient(135deg, #22d3ee 0%, #a3e635 100%);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.32);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .btn-lock:hover { filter: brightness(1.08); }
    .btn-lock:active { transform: scale(0.95); }

    /* کیپد تاکتیکی رمزگشایی (فشرده و بسیار سریع روی دسکتاپ و موبایل) */
    .decrypt-dock {
      pointer-events: auto;
      width: 100%;
      max-width: 580px;
      background: var(--panel-solid);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-cyan);
      border-radius: 16px;
      padding: 8px 10px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .decrypt-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .code-display {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(34, 211, 238, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--cyan);
      direction: ltr;
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
    }

    .code-display.empty {
      color: rgba(148, 163, 184, 0.38);
      text-shadow: none;
    }

    .code-display.wrong {
      border-color: var(--danger);
      color: var(--danger);
    }

    .num-key-row {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      direction: ltr;
    }

    .num-key {
      height: 38px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(30, 41, 59, 0.78);
      color: #f8fafc;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
    }

    .num-key:hover {
      background: rgba(51, 65, 85, 0.92);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .num-key:active {
      transform: scale(0.93);
      background: rgba(34, 211, 238, 0.22);
    }

    .btn-bksp {
      width: 44px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s ease;
    }

    .btn-bksp:hover {
      border-color: var(--danger);
      color: #fda4af;
    }

    /* =========================================================================
       آزمایشگاه آزاد (حالت کشف خلوت — بدون هیچ متن اضافی!)
       ========================================================================= */
    .lab-slider-dock {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 25;
      direction: ltr;
      display: flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .lab-slider-dock .tac-slider {
      width: 175px;
    }

    .lab-top-right {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 25;
    }

    .lab-bottom-left {
      position: fixed;
      bottom: 14px;
      left: 16px;
      z-index: 25;
      direction: ltr;
    }

    .lab-bottom-right {
      position: fixed;
      bottom: 14px;
      right: 16px;
      z-index: 25;
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
    }

    /* دکمه‌های آیکونی مشترک */
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.14s ease;
      outline: none;
    }

    .icon-btn:hover {
      border-color: var(--cyan);
      color: #ffffff;
    }

    .icon-btn:active { transform: scale(0.92); }

    .icon-btn.active {
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.28);
    }

    .lab-bottom-right .icon-btn {
      width: 35px;
      height: 35px;
      border-radius: 999px;
      border-color: transparent;
      background: transparent;
      backdrop-filter: none;
    }

    .lab-bottom-right .icon-btn:hover {
      background: rgba(148, 163, 184, 0.16);
    }

    .lab-bottom-right .icon-btn.active {
      background: rgba(34, 211, 238, 0.24);
      border-color: rgba(34, 211, 238, 0.65);
      color: var(--cyan);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .pill-sep {
      width: 1px;
      height: 20px;
      background: rgba(148, 163, 184, 0.24);
      margin: 0 2px;
    }

    /* نشان بازخورد تاکتیکی شناور */
    .tactical-toast {
      position: fixed;
      top: 118px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      z-index: 35;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .tactical-toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .tactical-toast.ok {
      background: rgba(15, 23, 42, 0.92);
      border-color: var(--emerald);
      color: var(--emerald);
      box-shadow: 0 0 22px rgba(163, 230, 53, 0.3);
    }

    .tactical-toast.crit {
      background: rgba(8, 47, 73, 0.95);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 26px rgba(34, 211, 238, 0.42);
    }

    .tactical-toast.err {
      background: rgba(45, 10, 22, 0.94);
      border-color: var(--danger);
      color: #fda4af;
      box-shadow: 0 0 22px rgba(244, 63, 94, 0.35);
    }

    /* =========================================================================
       انیمیشن‌ها
       ========================================================================= */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      18% { transform: translate(-7px, 3px); }
      38% { transform: translate(6px, -4px); }
      58% { transform: translate(-5px, -2px); }
      78% { transform: translate(4px, 2px); }
    }

    @keyframes shieldFlash {
      0% { transform: scale(1); color: #ffffff; }
      45% { transform: scale(1.45); color: var(--emerald); }
      100% { transform: scale(1); color: var(--cyan); }
    }

    /* =========================================================================
       واکنش‌گرایی برای موبایل، تبلت و پروژکتور ۱۶:۹
       ========================================================================= */
    @media (max-width: 680px) {
      .game-hud {
        top: 6px;
        left: 8px;
        right: 8px;
        gap: 5px;
      }

      .hud-chip {
        height: 32px;
        padding: 0 8px;
        font-size: 11.5px;
        gap: 4px;
        border-radius: 9px;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
      }

      .icon-btn svg {
        width: 16px;
        height: 16px;
      }

      .mission-strip {
        padding: 6px 11px;
        border-radius: 12px;
      }

      .mission-text {
        font-size: 12.2px;
      }

      .mission-timer-num {
        font-size: 12px;
      }

      .game-bottom-dock {
        bottom: 8px;
        left: 8px;
        right: 8px;
        gap: 6px;
      }

      .power-btn {
        height: 31px;
        padding: 0 10px;
        font-size: 11px;
      }

      .rotate-dock {
        width: 100%;
        justify-content: space-between;
        padding: 7px 9px;
        gap: 8px;
      }

      .tac-slider {
        width: 126px;
      }

      .step-btn {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .btn-lock {
        height: 34px;
        padding: 0 12px;
        font-size: 12.5px;
      }

      .decrypt-dock {
        padding: 7px 8px;
        gap: 6px;
      }

      .code-display {
        height: 36px;
        font-size: 19px;
      }

      .btn-bksp {
        width: 38px;
        height: 36px;
      }

      .num-key-row {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }

      .num-key {
        height: 36px;
        font-size: 15px;
      }

      .lab-slider-dock {
        top: 10px;
        left: 10px;
        padding: 5px 11px;
      }

      .lab-slider-dock .tac-slider {
        width: 132px;
      }

      .lab-top-right {
        top: 10px;
        right: 10px;
      }

      .lab-bottom-left {
        bottom: 10px;
        left: 10px;
      }

      .lab-bottom-right {
        bottom: 10px;
        right: 10px;
        gap: 2px;
        padding: 3px;
      }

      .lab-bottom-right .icon-btn {
        width: 32px;
        height: 32px;
      }

      .tactical-toast {
        top: 98px;
        font-size: 12.5px;
      }

      .tac-card {
        padding: 20px 16px 18px;
      }

      .tac-title {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <div id="appShell">
    <!-- بوم اصلی تمام‌صفحه HiDPI -->
    <canvas id="canvas"></canvas>

    <!-- هاله هشدار قرمز و هاله اورکلاک -->
    <div id="overclockVignette"></div>
    <div id="damageVignette"></div>

    <!-- نشان بازخورد سریع -->
    <div id="tacticalToast" class="tactical-toast"></div>

    <!-- =========================================================================
         صفحه شروع (روی بزرگراه شبانه زنده)
         ========================================================================= -->
    <div id="startScreen" class="overlay-screen">
      <div class="tac-card">
        <div class="tac-eyebrow">
          <span class="pulse-dot"></span>
          <span>INTERSECTION PROTOCOL // V2.6</span>
        </div>
        <h1 class="tac-title">پروتکل تقاطع</h1>
        <p class="tac-sub">سامانه تاکتیکی کنترل ترافیک، قطار پرسرعت و باند پرواز</p>

        <div class="mode-stack">
          <button id="btnModeCampaign" class="btn-tac btn-tac-primary" type="button">
            <span>مأموریت‌های تاکتیکی</span>
            <span class="btn-tag">۸ مرحله</span>
          </button>
          <button id="btnModeRush" class="btn-tac btn-tac-rush" type="button">
            <span>حالت بقا و رکورد</span>
            <span class="btn-tag">ضریب ۵×</span>
          </button>
          <button id="btnModeLab" class="btn-tac btn-tac-ghost" type="button">
            <span>آزمایشگاه آزاد</span>
            <span class="btn-tag">حالت کشف</span>
          </button>
        </div>

        <div class="start-meta">
          <span>بهترین رکورد ثبت‌شده</span>
          <strong id="startBestScore">۰</strong>
        </div>
      </div>
    </div>

    <!-- =========================================================================
         صفحه گزارش نهایی عملیات (پایان مأموریت یا Game Over)
         ========================================================================= -->
    <div id="summaryScreen" class="overlay-screen hidden">
      <div class="tac-card">
        <div id="summaryRankOrb" class="rank-orb rank-s">S</div>
        <h2 id="summaryTitle" class="tac-title" style="font-size: 24px;">پروتکل تکمیل شد</h2>
        <p id="summarySub" class="tac-sub" style="margin-bottom: 6px;">فرمانده ارشد تقاطع</p>

        <div class="stats-grid">
          <div class="stat-cell">
            <div class="stat-label">امتیاز نهایی</div>
            <div id="statScore" class="stat-val accent-cyan">۰</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">بهترین رکورد</div>
            <div id="statBest" class="stat-val accent-amber">۰</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">بیشترین زنجیره</div>
            <div id="statCombo" class="stat-val accent-lime">۱×</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">دقت عملیات</div>
            <div id="statAccuracy" class="stat-val">۱۰۰٪</div>
          </div>
        </div>

        <div class="mode-stack">
          <button id="btnSummaryReplay" class="btn-tac btn-tac-primary" type="button">
            <span>اجرای مجدد</span>
            <span class="btn-tag">↻</span>
          </button>
          <button id="btnSummaryRush" class="btn-tac btn-tac-rush" type="button">
            <span>حالت بقا و رکورد</span>
            <span class="btn-tag">∞</span>
          </button>
          <button id="btnSummaryLab" class="btn-tac btn-tac-ghost" type="button">
            <span>ورود به آزمایشگاه آزاد</span>
            <span class="btn-tag">LAB</span>
          </button>
        </div>
      </div>
    </div>

    <!-- =========================================================================
         رابط کاربری عملیات (Campaign و Endless Rush)
         ========================================================================= -->
    <div id="gameUI" class="ui-layer hidden">
      <div class="game-hud">
        <div class="hud-top-row">
          <!-- سمت راست: منو + نشان مرحله/موج -->
          <div class="hud-group">
            <button id="btnHudMenu" class="icon-btn" type="button" aria-label="منو" title="بازگشت به منو">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5" />
                <path d="M5.5 9.5V20h13V9.5" />
              </svg>
            </button>
            <div id="hudStage" class="hud-chip stage-chip">مرحله ۱ / ۸</div>
            <div id="hudCombo" class="hud-chip combo-chip hidden">×۲</div>
          </div>

          <!-- سمت چپ: امتیاز + سپرها + صدا -->
          <div class="hud-group">
            <div class="hud-chip">
              <span style="color: var(--amber);">◈</span>
              <span id="hudScore">۰</span>
            </div>
            <div id="hudShields" class="hud-chip" aria-label="سپر سیستم"></div>
            <button id="btnSound" class="icon-btn" type="button" aria-label="صدا" title="قطع/وصل صدا">
              <svg id="iconSoundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                <path d="M18.5 5.5a9 9 0 0 1 0 13" />
              </svg>
              <svg id="iconSoundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <line x1="22" y1="9" x2="16" y2="15" />
                <line x1="16" y1="9" x2="22" y2="15" />
              </svg>
            </button>
          </div>
        </div>

        <!-- نوار دستور یک‌خطی + تایمر -->
        <div id="missionStrip" class="mission-strip">
          <div class="mission-header">
            <div id="missionText" class="mission-text"></div>
            <div id="missionTimerNum" class="mission-timer-num">25.0s</div>
          </div>
          <div class="timer-track">
            <div id="timerFill" class="timer-fill"></div>
          </div>
        </div>
      </div>

      <!-- داک پایین: دکمه‌های قدرت (اسکن پالس + اورکلاک ۲×) و کنترل فعال -->
      <div class="game-bottom-dock">
        <div class="tactical-actions-row">
          <button id="btnPulseScan" class="power-btn scan-ready" type="button" title="اسکن پالس (Q)">
            <span>◎ اسکن پالس</span>
            <span id="scanChargesBadge" style="color: var(--cyan);">۱</span>
          </button>
          <button id="btnOverclock" class="power-btn hidden" type="button" title="زمان نصف و بدون رنگ = امتیاز ۲× و تعمیر سپر">
            <span>⚡ اورکلاک ۲×</span>
          </button>
        </div>

        <!-- پنل چرخش و قفل مسیر -->
        <div id="rotateDock" class="rotate-dock hidden">
          <div class="slider-ltr">
            <button id="btnAngleMinus" class="step-btn" type="button" aria-label="کاهش زاویه">−</button>
            <input id="gameSlider" class="tac-slider" type="range" min="30" max="150" step="1" value="115" aria-label="تنظیم زاویه مسیر مورب" />
            <button id="btnAnglePlus" class="step-btn" type="button" aria-label="افزایش زاویه">+</button>
          </div>
          <button id="btnLockAngle" class="btn-lock" type="button">
            <span>قفل مسیر</span>
            <span>↵</span>
          </button>
        </div>

        <!-- پنل رمزگشایی رادار (کیپد عددی تاکتیکی) -->
        <div id="decryptDock" class="decrypt-dock hidden">
          <div class="decrypt-top">
            <div id="codeDisplay" class="code-display empty">--°</div>
            <button id="btnBksp" class="btn-bksp" type="button" aria-label="پاک کردن">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
                <line x1="18" y1="9" x2="12" y2="15" />
                <line x1="12" y1="9" x2="18" y2="15" />
              </svg>
            </button>
            <button id="btnSubmitCode" class="btn-lock" type="button">
              <span>تأیید</span>
              <span>↵</span>
            </button>
          </div>
          <div id="numKeyRow" class="num-key-row"></div>
        </div>
      </div>
    </div>

    <!-- =========================================================================
         آزمایشگاه آزاد (حالت کشف خلوت — کاملاً بدون متن اضافی)
         ========================================================================= -->
    <div id="labUI" class="ui-layer hidden">
      <!-- لغزنده تاکتیکی مینیمال در بالا-چپ -->
      <div class="lab-slider-dock pointer-auto">
        <input id="labSlider" class="tac-slider" type="range" min="30" max="150" step="1" value="115" aria-label="تغییر زاویه" />
      </div>

      <!-- دکمه آیکونی بازگشت به منو در بالا-راست -->
      <div class="lab-top-right pointer-auto">
        <button id="btnLabMenu" class="icon-btn" type="button" aria-label="منو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5" />
            <path d="M5.5 9.5V20h13V9.5" />
          </svg>
        </button>
      </div>

      <!-- پخش/توقف چرخش خودکار در پایین-چپ -->
      <div class="lab-bottom-left pointer-auto">
        <button id="btnLabSweep" class="icon-btn" type="button" aria-label="چرخش خودکار">
          <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.5 5.8v12.4c0 .8.85 1.3 1.54.9l9.6-6.2a1.05 1.05 0 0 0 0-1.8l-9.6-6.2C9.35 4.5 8.5 5 8.5 5.8z" />
          </svg>
          <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6.5" y="5" width="4" height="14" rx="1.4" />
            <rect x="13.5" y="5" width="4" height="14" rx="1.4" />
          </svg>
        </button>
      </div>

      <!-- آیکون‌های انتخاب محیط + نمایش/مخفی اعداد و رنگ‌ها + تمام‌صفحه -->
      <div class="lab-bottom-right pointer-auto">
        <button class="icon-btn lab-world-btn active" data-world="highway" type="button" aria-label="بزرگراه شبانه">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 14l1.5-4.5A2 2 0 0 1 8.4 8h7.2a2 2 0 0 1 1.9 1.5L19 14" />
            <rect x="3.5" y="13.5" width="17" height="4.5" rx="1.5" />
            <circle cx="7.5" cy="18" r="1.3" fill="currentColor" />
            <circle cx="16.5" cy="18" r="1.3" fill="currentColor" />
          </svg>
        </button>
        <button class="icon-btn lab-world-btn" data-world="rail" type="button" aria-label="قطار پرسرعت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="12" height="12" rx="3" />
            <line x1="6" y1="10" x2="18" y2="10" />
            <circle cx="9.2" cy="13" r="0.9" fill="currentColor" />
            <circle cx="14.8" cy="13" r="0.9" fill="currentColor" />
            <path d="M8 16l-2 4" />
            <path d="M16 16l2 4" />
            <line x1="6.8" y1="18.5" x2="17.2" y2="18.5" />
          </svg>
        </button>
        <button class="icon-btn lab-world-btn" data-world="runway" type="button" aria-label="باند فرودگاه">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l2.5 6.5L21 12l-6.5 1.8L13 20l-1-1.5L11 20l-1.5-6.2L3 12l6.5-2.5L12 3z" />
          </svg>
        </button>
        <div class="pill-sep"></div>
        <!-- تاگل نمایش/مخفی اعداد زاویه‌ها -->
        <button id="btnLabNumbers" class="icon-btn active" type="button" aria-label="نمایش اعداد">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="9" x2="20" y2="9" />
            <line x1="4" y1="15" x2="20" y2="15" />
            <line x1="10" y1="4" x2="8" y2="20" />
            <line x1="16" y1="4" x2="14" y2="20" />
          </svg>
        </button>
        <!-- تاگل نمایش/مخفی رنگ‌های ۴+۴ -->
        <button id="btnLabColors" class="icon-btn active" type="button" aria-label="نمایش رنگ‌ها">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 3.5v17" />
            <path d="M3.5 12h17" />
          </svg>
        </button>
        <div class="pill-sep"></div>
        <!-- تمام‌صفحه -->
        <button id="btnFullscreen" class="icon-btn" type="button" aria-label="تمام‌صفحه">
          <svg id="iconFsEnter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 4 20 4 20 9" />
            <polyline points="9 20 4 20 4 15" />
            <polyline points="20 15 20 20 15 20" />
            <polyline points="4 9 4 4 9 4" />
          </svg>
          <svg id="iconFsExit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polyline points="4 14 10 14 10 20" />
            <polyline points="20 10 14 10 14 4" />
            <polyline points="14 20 14 14 20 14" />
            <polyline points="10 4 10 10 4 10" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* =======================================================================
         ثابت‌های هندسی و رنگی
         ======================================================================= */
      const MIN_ALPHA = 30;
      const MAX_ALPHA = 150;
      const SWEEP_SPEED = 18;
      const DEG_TO_RAD = Math.PI / 180;
      const RAD_TO_DEG = 180 / Math.PI;

      const Synth = {
        ctx: null,
        enabled: true,
        lastTickAt: 0,

        init() {
          try {
            if (!this.ctx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
          } catch (_) {}
        },

        tone(freq, dur, type, vol, delay = 0, endFreq = null) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (endFreq !== null) {
              osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur);
            }
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(vol, now + 0.009);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + dur + 0.02);
          } catch (_) {}
        },

        tick() {
          const now = performance.now();
          if (now - this.lastTickAt < 38) return;
          this.lastTickAt = now;
          this.tone(920, 0.024, 'triangle', 0.05, 0, 580);
        },

        key() {
          this.tone(660, 0.036, 'sine', 0.055, 0, 820);
        },

        sonar() {
          this.tone(1180, 0.28, 'sine', 0.11, 0, 740);
          this.tone(590, 0.45, 'triangle', 0.07, 0.05, 420);
        },

        overclock() {
          this.tone(240, 0.14, 'sawtooth', 0.06, 0, 480);
          this.tone(480, 0.16, 'triangle', 0.07, 0.09, 720);
        },

        lock(isCritical, comboLevel) {
          const pitchBoost = Math.pow(1.06, Math.min(comboLevel, 6));
          this.tone(220 * pitchBoost, 0.18, 'triangle', 0.12, 0);
          this.tone(330 * pitchBoost, 0.18, 'sine', 0.11, 0.05);
          this.tone(440 * pitchBoost, 0.26, 'sine', 0.12, 0.1);
          if (isCritical) {
            this.tone(660 * pitchBoost, 0.28, 'triangle', 0.12, 0.15);
            this.tone(880 * pitchBoost, 0.34, 'sine', 0.11, 0.21);
          }
        },

        error() {
          this.tone(160, 0.19, 'sawtooth', 0.085, 0, 108);
          this.tone(115, 0.24, 'square', 0.05, 0.09, 82);

          });
        }

      function toPersianNum(n) {
        const str = String(Math.round(n));
        let out = '';
        for (let i = 0; i < str.length; i++) {
          const code = str.charCodeAt(i) - 48;
          out += (code >= 0 && code <= 9) ? PERSIAN_DIGITS[code] : str[i];
        }
        return out;
      }

      function toPersianDeg(n) {
        return toPersianNum(n) + '°';
      }

      function normalizeDigitChar(ch) {
        if (ch >= '0' && ch <= '9') return ch;
        const pIdx = PERSIAN_DIGITS.indexOf(ch);
        if (pIdx !== -1) return String(pIdx);
        // پشتیبانی از ارقام عربی-هندی (٠-٩)
        const c = ch.charCodeAt(0);
        if (c >= 0x0660 && c <= 0x0669) return String(c - 0x0660);
        return null;
      }

      function drawRoundedRect(x, y, w, h, r) {
        const rr = Math.min(r, w * 0.5, h * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }
