        const maxHalfHFromWidth = Math.max(46, (width * 0.5 - padX) / 1.732);
        const maxHalfHFromHeight = usableH * 0.285;
        const halfH = Math.max(46, Math.min(maxHalfHFromHeight, maxHalfHFromWidth, 148));

        geom.H = halfH * 2;
        geom.y1 = geom.cy - halfH;
        geom.y2 = geom.cy + halfH;

        const minDim = Math.min(width, usableH);
        geom.roadHalfW = Math.max(20, Math.min(28, minDim * 0.058));
        geom.sectorR = Math.max(30, Math.min(46, minDim * 0.098, halfH * 0.54));

        // مختصات دقیق تقاطع بالا و پایین
        const rad = currentAlpha * DEG_TO_RAD;
        const tanA = Math.tan(rad);
        const offset = Math.abs(tanA) > 1e-6 ? (geom.H * 0.5) / tanA : 0;
        geom.ix1 = geom.cx + offset;
        geom.ix2 = geom.cx - offset;
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        updateGeometry();
      }

      /* =======================================================================
         پس‌زمینه مشترک راداری شبانه
         ======================================================================= */
      function drawTacticalGridBg(tintHex) {
        const bg = ctx.createRadialGradient(
          geom.cx, geom.cy, 30,
          geom.cx, geom.cy, Math.max(width, height) * 0.85
        );
        bg.addColorStop(0, tintHex);
        bg.addColorStop(0.6, '#091020');
        bg.addColorStop(1, '#050811');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        // شبکه مختصات ظریف راداری
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
        ctx.lineWidth = 1;
        const step = 48;
        ctx.beginPath();
        for (let x = 0; x < width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        for (let y = 0; y < height; y += step) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();
        ctx.restore();
      }

      /* =======================================================================
         محیط ۱: بزرگراه شبانه (Night Expressway)
         ======================================================================= */
      function drawNightCar(x, y, heading, car, speedMult) {
        const L = car.len;
        const W = car.wid;
        const hL = L * 0.5;
        const hW = W * 0.5;
        const isOverdrive = speedMult > 1.3;
        const hazardBlink = hazardFlashTimer > 0 && Math.floor(elapsedTime * 16) % 2 === 0;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);

        // مخروط نور چراغ‌های جلو
        const beamLen = isOverdrive ? 52 : 36;
        const beam = ctx.createLinearGradient(hL - 2, 0, hL + beamLen, 0);
        beam.addColorStop(0, isOverdrive ? 'rgba(34, 211, 238, 0.55)' : 'rgba(224, 242, 254, 0.44)');
        beam.addColorStop(1, 'rgba(224, 242, 254, 0)');
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(hL - 1, -hW + 2);
        ctx.lineTo(hL + beamLen, -hW - 9);
        ctx.lineTo(hL + beamLen, hW + 9);
        ctx.lineTo(hL - 1, hW - 2);
        ctx.closePath();
        ctx.fill();

        // هاله قرمز چراغ عقب
        const tail = ctx.createLinearGradient(-hL, 0, -hL - 16, 0);
        tail.addColorStop(0, 'rgba(244, 63, 94, 0.52)');
        tail.addColorStop(1, 'rgba(244, 63, 94, 0)');
        ctx.fillStyle = tail;
        ctx.fillRect(-hL - 16, -hW + 1, 16, W - 2);

        // بدنه خودرو
        ctx.fillStyle = car.kind === 'truck' ? '#1e293b' : '#0f172a';
        drawRoundedRect(-hL, -hW, L, W, car.kind === 'truck' ? 3.5 : 5.5);
        ctx.fill();

        // رنگ‌آمیزی بدنه متالیک
        ctx.fillStyle = car.color;
        if (car.kind === 'truck') {
          drawRoundedRect(-hL + 1.5, -hW + 1.5, L * 0.68, W - 3, 2.5);
          ctx.fill();
          ctx.fillStyle = '#334155';
          drawRoundedRect(hL - L * 0.27, -hW + 2, L * 0.25, W - 4, 3);
          ctx.fill();
        } else {
          drawRoundedRect(-hL + 1, -hW + 1, L - 2, W - 2, 4.8);
          ctx.fill();
          // شیشه تاریک کابین
          ctx.fillStyle = '#090d16';
          drawRoundedRect(-hL + L * 0.22, -hW + 2.4, L * 0.46, W - 4.8, 3);
          ctx.fill();
          // نوار سقف
          ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.fillRect(-hL + L * 0.34, -hW + 3.4, L * 0.22, W - 6.8);
        }

        // چراغ‌های جلو
        ctx.fillStyle = isOverdrive ? '#67e8f9' : '#f8fafc';
        ctx.fillRect(hL - 2.4, -hW + 2, 2.4, 3.2);
        ctx.fillRect(hL - 2.4, hW - 5.2, 2.4, 3.2);

        // چراغ‌های عقب یا فلاشر هشدار
        ctx.fillStyle = hazardBlink ? '#fbbf24' : '#f43f5e';
        ctx.fillRect(-hL, -hW + 2, 2.5, 3.4);
        ctx.fillRect(-hL, hW - 5.4, 2.5, 3.4);
        if (hazardBlink) {
          ctx.fillRect(hL - 2.5, -hW + 1.2, 2.5, 2.5);
          ctx.fillRect(hL - 2.5, hW - 3.7, 2.5, 2.5);
        }

        ctx.restore();
      }

      function drawNightHighway(y) {
        const hw = geom.roadHalfW;

        // حاشیه بتنی تیره
        ctx.fillStyle = '#141c2d';
        ctx.fillRect(0, y - hw - 5, width, (hw + 5) * 2);

        // آسفالت شبانه
        const ag = ctx.createLinearGradient(0, y - hw, 0, y + hw);
        ag.addColorStop(0, '#0c1220');
        ag.addColorStop(0.5, '#162033');
        ag.addColorStop(1, '#0c1220');
        ctx.fillStyle = ag;
        ctx.fillRect(0, y - hw, width, hw * 2);

        // لبه‌های نئون ظریف شانه بزرگراه
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.26)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, y - hw + 1.5);
        ctx.lineTo(width, y - hw + 1.5);
        ctx.moveTo(0, y + hw - 1.5);
        ctx.lineTo(width, y + hw - 1.5);
        ctx.stroke();

        // خط‌چین سفید میانی
        ctx.save();
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.48)';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([18, 16]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
        ctx.restore();

        // تیرچراغ‌های درخشان کنار جاده
        for (let x = 44; x < width; x += 140) {
          [y - hw - 4, y + hw + 4].forEach(function (ly) {
            const g = ctx.createRadialGradient(x, ly, 1, x, ly, 16);
            g.addColorStop(0, 'rgba(56, 189, 248, 0.42)');
            g.addColorStop(1, 'rgba(56, 189, 248, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, ly, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#bae6fd';
            ctx.beginPath();
            ctx.arc(x, ly, 1.8, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }

      function renderHighwayWorld(dt, speedMult) {
        drawTacticalGridBg('#0d1629');

        // بلوک‌های تیره ساختمان‌های شهر در پس‌زمینه
        ctx.save();
        for (let i = 0; i < CITY_BLOCKS.length; i++) {
          const b = CITY_BLOCKS[i];
          const bx = b.rx * width - b.w * 0.5;
          const by = b.ry * height - b.h * 0.5;
          // عدم ترسیم روی باند جاده‌ها
          if (Math.abs(by + b.h * 0.5 - geom.y1) < geom.roadHalfW + 32) continue;
          if (Math.abs(by + b.h * 0.5 - geom.y2) < geom.roadHalfW + 32) continue;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
          ctx.fillRect(bx, by, b.w, b.h);
          ctx.strokeStyle = b.lit ? 'rgba(34, 211, 238, 0.14)' : 'rgba(148, 163, 184, 0.08)';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, by, b.w, b.h);
        }
        ctx.restore();

        // دو بزرگراه موازی افقی
        drawNightHighway(geom.y1);
        drawNightHighway(geom.y2);

        // خودروهای دو بزرگراه موازی
        const laneOff = geom.roadHalfW * 0.48;
        const margin = 95;
        const spanX = width + margin * 2;
        for (let i = 0; i < HIGHWAY_VEHICLES.length; i++) {
          const v = HIGHWAY_VEHICLES[i];
          v.pos += (v.lane * v.speed * speedMult * dt) / spanX;
          if (v.pos > 1) v.pos -= 1;
          if (v.pos < 0) v.pos += 1;
          const vx = -margin + v.pos * spanX;
          const vy = (v.road === 0 ? geom.y1 : geom.y2) + v.lane * laneOff;
          drawNightCar(vx, vy, v.lane > 0 ? 0 : Math.PI, v, speedMult);
        }

        // پل بزرگراهی مورب چرخان
        const ohw = geom.roadHalfW - 3;
        const span = Math.hypot(width, height) + 200;
        const rad = currentAlpha * DEG_TO_RAD;

        ctx.save();
        ctx.translate(geom.cx, geom.cy);
        ctx.rotate(-rad);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
        ctx.fillRect(-span, -ohw - 4, span * 2, (ohw + 4) * 2 + 6);

        const og = ctx.createLinearGradient(0, -ohw, 0, ohw);
        og.addColorStop(0, '#10192b');
        og.addColorStop(0.5, '#1d2b44');
        og.addColorStop(1, '#10192b');
        ctx.fillStyle = og;
        ctx.fillRect(-span, -ohw, span * 2, ohw * 2);

        ctx.strokeStyle = 'rgba(34, 211, 238, 0.45)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-span, -ohw);
        ctx.lineTo(span, -ohw);
        ctx.moveTo(-span, ohw);
        ctx.lineTo(span, ohw);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(226, 232, 240, 0.5)';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([16, 15]);
        ctx.beginPath();
        ctx.moveTo(-span, 0);
        ctx.lineTo(span, 0);
        ctx.stroke();
        ctx.restore();

        // خودروهای روی بزرگراه مورب
        const ux = Math.cos(rad);
        const uy = -Math.sin(rad);
        const nx = -uy;
        const ny = ux;
        const oLaneOff = ohw * 0.48;
        const oHalfSpan = Math.hypot(width, height) * 0.58 + 80;
        const oFullSpan = oHalfSpan * 2;
        for (let i = 0; i < OVERPASS_VEHICLES.length; i++) {
          const v = OVERPASS_VEHICLES[i];
          v.pos += (v.lane * v.speed * speedMult * dt) / oFullSpan;
          if (v.pos > 1) v.pos -= 1;
          if (v.pos < 0) v.pos += 1;
          const s = -oHalfSpan + v.pos * oFullSpan;
          const vx = geom.cx + s * ux + v.lane * oLaneOff * nx;
          const vy = geom.cy + s * uy + v.lane * oLaneOff * ny;
          drawNightCar(vx, vy, v.lane > 0 ? -rad : -rad + Math.PI, v, speedMult);
        }
      }

      /* =======================================================================
         محیط ۲: خطوط قطار پرسرعت مگلو (Maglev Rail)
         ======================================================================= */
      function drawMaglevTrack(y) {
        const hw = geom.roadHalfW;
        const railOff = 12;

        // بستر فولادی تیره ریل
        const bg = ctx.createLinearGradient(0, y - hw, 0, y + hw);
        bg.addColorStop(0, 'rgba(15, 23, 42, 0)');
        bg.addColorStop(0.2, 'rgba(15, 23, 42, 0.92)');
        bg.addColorStop(0.5, 'rgba(30, 41, 59, 0.95)');
        bg.addColorStop(0.8, 'rgba(15, 23, 42, 0.92)');
        bg.addColorStop(1, 'rgba(15, 23, 42, 0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, y - hw, width, hw * 2);

        // تراورس‌های فولادی
        ctx.fillStyle = '#273549';
        for (let x = 0; x < width + 20; x += 20) {
          ctx.fillRect(x, y - 19, 6, 38);
        }

        // ریل‌های برق‌دار با درخشش ظریف
        [y - railOff, y + railOff].forEach(function (ry) {
          ctx.fillStyle = '#475569';
          ctx.fillRect(0, ry - 2.2, width, 4.4);
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(0, ry - 1, width, 1.8);
        });

        // بیکن‌های سیگنال چشمک‌زن کنار ریل
        const pulse = 0.45 + 0.55 * Math.sin(elapsedTime * 4.5);
        for (let x = 70; x < width; x += 180) {
          ctx.fillStyle = `rgba(34, 211, 238, ${0.22 * pulse})`;
          ctx.beginPath();
          ctx.arc(x, y - hw + 2, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#22d3ee';
          ctx.beginPath();
          ctx.arc(x, y - hw + 2, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawBulletTrain(train, y, speedMult) {
        const carLen = 78;
        const carW = 24;
        const gap = 4;
        const total = 1 + train.cars;
        const glowColor = speedMult > 1.3 ? '#22d3ee' : train.glow;

        ctx.save();
        ctx.translate(train.x, y);
        if (train.dir < 0) ctx.scale(-1, 1);

        // دنباله نور سرعت پشت قطار
        const trailX = -total * (carLen + gap);
        const trail = ctx.createLinearGradient(trailX + carLen, 0, trailX - 70, 0);
        trail.addColorStop(0, 'rgba(34, 211, 238, 0.25)');
        trail.addColorStop(1, 'rgba(34, 211, 238, 0)');
        ctx.fillStyle = trail;
        ctx.fillRect(trailX - 70, -carW * 0.42, 70 + carLen, carW * 0.84);

        for (let i = total - 1; i >= 0; i--) {
          const sx = -i * (carLen + gap);
          const isNose = (i === 0);

          if (!isNose) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(sx + carLen - 1, -6, gap + 2, 12);
          }

          // بدنه آیرودینامیک
          ctx.fillStyle = '#1e293b';
          drawRoundedRect(sx, -carW * 0.5, carLen, carW, isNose ? 12 : 5);
          ctx.fill();

          ctx.fillStyle = train.body;
          drawRoundedRect(sx + 1, -carW * 0.5 + 1, carLen - 2, carW - 2, isNose ? 11 : 4.5);
          ctx.fill();

          // نوار نئون جانبی و پنجره‌های روشن
          ctx.fillStyle = glowColor;
          ctx.fillRect(sx + 4, -carW * 0.5 + 2.4, carLen - (isNose ? 18 : 8), 2.4);
          ctx.fillRect(sx + 4, carW * 0.5 - 4.8, carLen - (isNose ? 18 : 8), 2.4);

          // سقف تیره مرکزی
          ctx.fillStyle = '#334155';
          drawRoundedRect(sx + 7, -5.5, carLen - (isNose ? 26 : 14), 11, 3);
          ctx.fill();

          // دماغه و نور جلوی قطار پرسرعت
          if (isNose) {
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.arc(sx + carLen - 12, 0, 7.5, -Math.PI * 0.48, Math.PI * 0.48);
            ctx.fill();

            const beam = ctx.createLinearGradient(sx + carLen - 2, 0, sx + carLen + 65, 0);
            beam.addColorStop(0, 'rgba(165, 243, 252, 0.58)');
            beam.addColorStop(1, 'rgba(165, 243, 252, 0)');
            ctx.fillStyle = beam;
            ctx.beginPath();
            ctx.moveTo(sx + carLen - 2, -6);
            ctx.lineTo(sx + carLen + 65, -18);
            ctx.lineTo(sx + carLen + 65, 18);
            ctx.lineTo(sx + carLen - 2, 6);
            ctx.closePath();
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function renderRailWorld(dt, speedMult) {
        drawTacticalGridBg('#0b1526');

        // دو خط ریل موازی
        drawMaglevTrack(geom.y1);
        drawMaglevTrack(geom.y2);

        // حرکت قطارهای پرسرعت
        const trainLen = 420;
        for (let i = 0; i < MAGLEV_TRAINS.length; i++) {
          const t = MAGLEV_TRAINS[i];
          t.x += t.dir * t.speed * speedMult * dt;
          if (t.dir > 0 && t.x - trainLen > width + 110) t.x = -120;
          else if (t.dir < 0 && t.x + trainLen < -110) t.x = width + 120;
          drawBulletTrain(t, t.track === 0 ? geom.y1 : geom.y2, speedMult);
        }

        // پل انتقال ریلی مورب
        const thw = geom.roadHalfW - 4;
        const span = Math.hypot(width, height) + 200;
        const rad = currentAlpha * DEG_TO_RAD;

        ctx.save();
        ctx.translate(geom.cx, geom.cy);
        ctx.rotate(-rad);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(-span, -thw - 4, span * 2, (thw + 4) * 2 + 5);

        ctx.fillStyle = '#182235';
        ctx.fillRect(-span, -thw, span * 2, thw * 2);

        // سازه خرپایی کنار پل ریلی
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.32)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (let x = -span; x < span; x += 26) {
          ctx.moveTo(x, -thw);
          ctx.lineTo(x + 13, -thw + 5);
          ctx.lineTo(x + 26, -thw);
          ctx.moveTo(x, thw);
          ctx.lineTo(x + 13, thw - 5);
          ctx.lineTo(x + 26, thw);
        }
        ctx.stroke();

        // دو ریل روی پل مورب
        [-7, 7].forEach(function (ry) {
          ctx.fillStyle = '#64748b';
          ctx.fillRect(-span, ry - 1.5, span * 2, 3);
        });
        ctx.restore();

        // واگن‌های خدماتی روی پل ریلی مورب
        const ux = Math.cos(rad);
        const uy = -Math.sin(rad);
        const halfSpan = Math.hypot(width, height) * 0.56 + 80;
        const fullSpan = halfSpan * 2;
        for (let i = 0; i < UTILITY_RAILCARS.length; i++) {
          const uc = UTILITY_RAILCARS[i];
          uc.pos += (uc.lane * uc.speed * speedMult * dt) / fullSpan;
          if (uc.pos > 1) uc.pos -= 1;
          if (uc.pos < 0) uc.pos += 1;
          const s = -halfSpan + uc.pos * fullSpan;
          const uxPos = geom.cx + s * ux;
          const uyPos = geom.cy + s * uy;

          ctx.save();
          ctx.translate(uxPos, uyPos);
          ctx.rotate(uc.lane > 0 ? -rad : -rad + Math.PI);
          ctx.fillStyle = '#334155';
          drawRoundedRect(-22, -8.5, 44, 17, 4);
          ctx.fill();
          ctx.strokeStyle = uc.glow;
          ctx.lineWidth = 1.6;
          ctx.stroke();
          ctx.fillStyle = uc.glow;
          ctx.fillRect(14, -4, 5, 8);
          ctx.restore();
        }
      }

      /* =======================================================================
         محیط ۳: باندهای فرودگاه تاکتیکی (Twin Runways)
         ======================================================================= */
      function drawRunwayStrip(y) {
        const hw = geom.roadHalfW + 3;

        // آسفالت باند پرواز
        const rg = ctx.createLinearGradient(0, y - hw, 0, y + hw);
        rg.addColorStop(0, '#0a101d');
        rg.addColorStop(0.5, '#131d31');
        rg.addColorStop(1, '#0a101d');
        ctx.fillStyle = rg;
        ctx.fillRect(0, y - hw, width, hw * 2);

        // خط‌کشی لبه و خط میانی باند
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.34)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, y - hw + 3);
        ctx.lineTo(width, y - hw + 3);
        ctx.moveTo(0, y + hw - 3);
        ctx.lineTo(width, y + hw - 3);
        ctx.stroke();

        ctx.save();
        ctx.strokeStyle = 'rgba(248, 250, 252, 0.62)';
        ctx.lineWidth = 2.6;
        ctx.setLineDash([28, 22]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
        ctx.restore();

        // خطوط پیانویی آستانه باند در دو طرف
        ctx.fillStyle = 'rgba(248, 250, 252, 0.45)';
        for (let row = -3; row <= 3; row++) {
          if (row === 0) continue;
          ctx.fillRect(14, y + row * 7 - 1.5, 22, 3);
          ctx.fillRect(width - 36, y + row * 7 - 1.5, 22, 3);
        }

        // چراغ‌های چشمک‌زن آبی و سفید لبه و خط میانی باند
        const wave = elapsedTime * 5.2;
        for (let x = 42; x < width - 30; x += 72) {
          const glow = 0.45 + 0.55 * Math.sin(wave - x * 0.02);
          ctx.fillStyle = `rgba(34, 211, 238, ${0.35 * glow})`;
          ctx.beginPath();
          ctx.arc(x, y - hw + 2, 6, 0, Math.PI * 2);
          ctx.arc(x, y + hw - 2, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e0f2fe';
          ctx.beginPath();
          ctx.arc(x, y - hw + 2, 1.6, 0, Math.PI * 2);
          ctx.arc(x, y + hw - 2, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawTacticalJet(x, y, heading, jet, speedMult) {
        const isFighter = jet.kind === 'fighter';
        const strobe = Math.floor(elapsedTime * 7) % 2 === 0;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);

        // شعله موتور جت
        const flameLen = (speedMult > 1.3 ? 28 : 16) + Math.sin(elapsedTime * 40) * 3;
        const fl = ctx.createLinearGradient(-16, 0, -16 - flameLen, 0);
        fl.addColorStop(0, speedMult > 1.3 ? 'rgba(34, 211, 238, 0.85)' : 'rgba(251, 146, 60, 0.8)');
        fl.addColorStop(1, 'rgba(34, 211, 238, 0)');
        ctx.fillStyle = fl;
        ctx.beginPath();
        ctx.moveTo(-14, -4);
        ctx.lineTo(-16 - flameLen, 0);
        ctx.lineTo(-14, 4);
        ctx.closePath();
        ctx.fill();

        if (isFighter) {
          // جت شکاری بال‌متمایل
          ctx.fillStyle = jet.color;
          ctx.beginPath();
          ctx.moveTo(22, 0);
          ctx.lineTo(6, -5);
          ctx.lineTo(-8, -21);
          ctx.lineTo(-14, -21);
          ctx.lineTo(-8, -5);
          ctx.lineTo(-18, -9);
          ctx.lineTo(-20, -4);
          ctx.lineTo(-16, 0);
          ctx.lineTo(-20, 4);
          ctx.lineTo(-18, 9);
          ctx.lineTo(-8, 5);
          ctx.lineTo(-14, 21);
          ctx.lineTo(-8, 21);
          ctx.lineTo(6, 5);
          ctx.closePath();
          ctx.fill();

          // کاکپیت شیشه‌ای
          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath();
          ctx.ellipse(7, 0, 5.5, 2.2, 0, 0, Math.PI * 2);
          ctx.fill();

          // چراغ نوک بال قرمز و سبز
          ctx.fillStyle = strobe ? '#f43f5e' : 'rgba(244, 63, 94, 0.35)';
          ctx.beginPath();
          ctx.arc(-11, -20.5, 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = strobe ? '#a3e635' : 'rgba(163, 230, 53, 0.35)';
          ctx.beginPath();
          ctx.arc(-11, 20.5, 2.4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // هواپیمای ترابری/مسافربری مدرن
          ctx.fillStyle = jet.color;
          ctx.beginPath();
          ctx.moveTo(24, 0);
          ctx.quadraticCurveTo(18, -4.5, 8, -4.5);
          ctx.lineTo(-6, -24);
          ctx.lineTo(-12, -24);
          ctx.lineTo(-4, -4.2);
          ctx.lineTo(-17, -4);
          ctx.lineTo(-22, -11);
          ctx.lineTo(-25, -11);
          ctx.lineTo(-21, 0);
          ctx.lineTo(-25, 11);
          ctx.lineTo(-22, 11);
          ctx.lineTo(-17, 4);
          ctx.lineTo(-4, 4.2);
          ctx.lineTo(-12, 24);
          ctx.lineTo(-6, 24);
          ctx.lineTo(8, 4.5);
          ctx.quadraticCurveTo(18, 4.5, 24, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#0f172a';
          ctx.fillRect(14, -2.2, 4, 4.4);

          ctx.fillStyle = strobe ? '#f43f5e' : 'rgba(244, 63, 94, 0.35)';
          ctx.beginPath();
          ctx.arc(-9, -23.5, 2.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = strobe ? '#a3e635' : 'rgba(163, 230, 53, 0.35)';
          ctx.beginPath();
          ctx.arc(-9, 23.5, 2.3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function renderRunwayWorld(dt, speedMult) {
        drawTacticalGridBg('#091325');

        // دو باند پرواز موازی
        drawRunwayStrip(geom.y1);
        drawRunwayStrip(geom.y2);

        // حرکت جت‌ها روی هر دو باند
        const margin = 120;
        const spanX = width + margin * 2;
        for (let i = 0; i < RUNWAY_JETS.length; i++) {
          const j = RUNWAY_JETS[i];
          j.pos += (j.dir * j.speed * speedMult * dt) / spanX;
          if (j.pos > 1) j.pos -= 1;
          if (j.pos < 0) j.pos += 1;
          const jx = -margin + j.pos * spanX;
          const jy = j.runway === 0 ? geom.y1 : geom.y2;
          drawTacticalJet(jx, jy, j.dir > 0 ? 0 : Math.PI, j, speedMult);
        }

        // تاکسی‌وی مورب چرخان با خط‌کشی زرد هوانوردی
        const thw = geom.roadHalfW - 4;
        const span = Math.hypot(width, height) + 200;
        const rad = currentAlpha * DEG_TO_RAD;

        ctx.save();
        ctx.translate(geom.cx, geom.cy);
        ctx.rotate(-rad);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(-span, -thw - 3, span * 2, (thw + 3) * 2 + 4);

        ctx.fillStyle = '#141f34';
        ctx.fillRect(-span, -thw, span * 2, thw * 2);

        // خط زرد میانی تاکسی‌وی
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.72)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-span, 0);
        ctx.lineTo(span, 0);
        ctx.stroke();

        // چراغ‌های آبی لبه تاکسی‌وی
        for (let x = -span; x < span; x += 68) {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(x, -thw + 2, 1.7, 0, Math.PI * 2);
          ctx.arc(x, thw - 2, 1.7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // پهپاد / رهگیر گشتی روی تاکسی‌وی مورب
        const ux = Math.cos(rad);
        const uy = -Math.sin(rad);
        const halfSpan = Math.hypot(width, height) * 0.56 + 80;
        const fullSpan = halfSpan * 2;
        for (let i = 0; i < TAXIWAY_CRAFT.length; i++) {
          const tc = TAXIWAY_CRAFT[i];
          tc.pos += (tc.lane * tc.speed * speedMult * dt) / fullSpan;
          if (tc.pos > 1) tc.pos -= 1;
          if (tc.pos < 0) tc.pos += 1;
          const s = -halfSpan + tc.pos * fullSpan;
          const tx = geom.cx + s * ux;
          const ty = geom.cy + s * uy;
          drawTacticalJet(tx, ty, tc.lane > 0 ? -rad : -rad + Math.PI, { kind: 'fighter', color: tc.color }, speedMult * 0.8);
        }
      }

      /* =======================================================================
         لایه هندسی راداری (خطوط راهنما + ۸ قطاع زاویه + اعداد فارسی روی بالاترین لایه)
         ======================================================================= */
      function drawTacticalMathLines() {
        const span = Math.hypot(width, height) + 140;
        const rad = currentAlpha * DEG_TO_RAD;
        const ux = Math.cos(rad);
        const uy = -Math.sin(rad);

        ctx.save();
        ctx.lineCap = 'round';

        // دو خط موازی افقی
        [geom.y1, geom.y2].forEach(function (y) {
          ctx.strokeStyle = 'rgba(34, 211, 238, 0.28)';
          ctx.lineWidth = 4;
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(163, 230, 53, 0.82)';
          ctx.lineWidth = 1.8;
          ctx.setLineDash([12, 8]);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        });

        // خط مورب چرخان
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.34)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(geom.cx - span * ux, geom.cy - span * uy);
        ctx.lineTo(geom.cx + span * ux, geom.cy + span * uy);
        ctx.stroke();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(geom.cx - span * ux, geom.cy - span * uy);
        ctx.lineTo(geom.cx + span * ux, geom.cy + span * uy);
        ctx.stroke();

        // دستگیره چرخش ظریف در حالت‌های قابل چرخش
        if (canRotateNow()) {
          const handleDist = Math.min(geom.H * 0.82, 130);
          [1, -1].forEach(function (sign) {
            const hx = geom.cx + sign * handleDist * ux;
            const hy = geom.cy + sign * handleDist * uy;
            ctx.beginPath();
            ctx.arc(hx, hy, 7, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fill();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.stroke();
          });
        }

        ctx.restore();
      }

      function buildWedges(alphaVal) {
        const aRad = alphaVal * DEG_TO_RAD;
        const supp = 180 - alphaVal;
        return [
          { pos: 'TR', start: -aRad, end: 0, bisector: -aRad * 0.5, span: alphaVal },
          { pos: 'TL', start: -Math.PI, end: -aRad, bisector: (-Math.PI - aRad) * 0.5, span: supp },
          { pos: 'BL', start: Math.PI - aRad, end: Math.PI, bisector: Math.PI - aRad * 0.5, span: alphaVal },
          { pos: 'BR', start: 0, end: Math.PI - aRad, bisector: (Math.PI - aRad) * 0.5, span: supp }
        ];
      }

      function shouldShowColors() {
        if (appMode === 'lab') return labShowColors;
        if (appMode === 'start' || appMode === 'summary') return true;
        if (revealPhaseSuccess || pulseScanTimer > 0) return true;
        if (overclockArmed) return false;
        if (activePhase && activePhase.blackout) return false;
        return true;
      }

      function getWedgeColors(spanDeg, showColors) {
        if (!showColors) {
          return { fill: BLACKOUT_FILL, stroke: BLACKOUT_STROKE, text: BLACKOUT_TEXT };
        }
        const rounded = Math.round(spanDeg);
        if (rounded === 90) {
          return { fill: RIGHT_FILL, stroke: RIGHT_STROKE, text: RIGHT_TEXT };
        }
        if (rounded < 90) {
          return { fill: ACUTE_FILL, stroke: ACUTE_STROKE, text: ACUTE_TEXT };
        }
        return { fill: OBTUSE_FILL, stroke: OBTUSE_STROKE, text: OBTUSE_TEXT };
      }

      function drawIntersectionOverlay(interIdx, cx, cy, alphaVal) {
        const r = geom.sectorR;
        const wedges = buildWedges(alphaVal);
        const showColors = shouldShowColors();
        const pulse = 0.5 + 0.5 * Math.sin(elapsedTime * 6.5);

        const isPlaying = (appMode === 'campaign' || appMode === 'rush') && activePhase;
        const isDecrypt = isPlaying && activePhase.type === 'decrypt' && !revealPhaseSuccess;
        const isRotate = isPlaying && activePhase.type === 'rotate' && !revealPhaseSuccess;

        ctx.save();

        // ۱. رسم قطاع‌های رنگی نئون
        for (let i = 0; i < wedges.length; i++) {
          const w = wedges[i];
          const key = interIdx + ':' + w.pos;
          const isTarget = isPlaying && !revealPhaseSuccess && key === activePhase.targetKey;
          const isGiven = isDecrypt && key === activePhase.givenKey;
          const isHintEqual = hintTimer > 0 && hintData && hintData.mode === 'equal' && Math.round(w.span) === hintData.targetSpan;

          const col = getWedgeColors(w.span, showColors || isHintEqual);
          const drawR = isTarget ? r + pulse * 4 : r;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, drawR, w.start, w.end, false);
          ctx.closePath();

          ctx.fillStyle = col.fill;
          ctx.fill();

          if (isTarget) {
            ctx.strokeStyle = isDecrypt
              ? `rgba(244, 63, 94, ${0.65 + pulse * 0.35})`
              : `rgba(34, 211, 238, ${0.68 + pulse * 0.32})`;
            ctx.lineWidth = 3;
            ctx.stroke();
          } else if (isHintEqual) {
            ctx.strokeStyle = `rgba(163, 230, 53, ${0.55 + pulse * 0.45})`;
            ctx.lineWidth = 3;
            ctx.stroke();
          } else if (isGiven) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.2;
            ctx.stroke();
          } else {
            ctx.strokeStyle = col.stroke;
            ctx.lineWidth = 1.4;
            ctx.stroke();
          }
        }

        // راس مرکزی تقاطع
        ctx.beginPath();
        ctx.arc(cx, cy, 4.2, 0, Math.PI * 2);
        ctx.fillStyle = '#070b14';
        ctx.fill();
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 2;
        ctx.stroke();

        // ۲. برچسب اعداد با ارقام فارسی روی نشان‌های تاریک با کنتراست بالا
        const fontSize = Math.max(15, Math.min(20, Math.round(r * 0.44)));
        ctx.font = `800 ${fontSize}px 'Vazirmatn', 'Tahoma', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.direction = 'ltr';

        for (let i = 0; i < wedges.length; i++) {
          const w = wedges[i];
          const key = interIdx + ':' + w.pos;
          const isTarget = isPlaying && !revealPhaseSuccess && key === activePhase.targetKey;
          const isGiven = isDecrypt && key === activePhase.givenKey;

          // تعیین نمایش یا عدم نمایش عدد برای این قطاع
          let showNumber = true;
          let showQuestion = false;

          if (appMode === 'lab') {
            showNumber = labShowNumbers;
          } else if (isDecrypt) {
            if (isTarget) {
              showNumber = false;
              showQuestion = true;
            } else if (isGiven) {
              showNumber = true;
            } else {
              showNumber = false;
            }
          } else if (isRotate) {
            if (activePhase.numberMask === 'top' && interIdx === 1) {
              showNumber = false;
              if (isTarget) showQuestion = true; // نمایش هدف قفل روی تقاطع بدون عدد
            }
          }

          if (!showNumber && !showQuestion) continue;

          const col = getWedgeColors(w.span, showColors);
          const halfSpanRad = (w.span * 0.5) * DEG_TO_RAD;
          const clearanceR = 22 / Math.max(Math.sin(halfSpanRad), 0.25);
          const labelR = Math.min(r + 50, Math.max(r + 22, clearanceR));

          const lx = cx + Math.cos(w.bisector) * labelR;
          const ly = cy + Math.sin(w.bisector) * labelR;

          if (showQuestion) {
            const badgeR = 17 + pulse * 2.2;
            const ringColor = isDecrypt ? '#f43f5e' : '#22d3ee';
            ctx.save();
            ctx.beginPath();
            ctx.arc(lx, ly, badgeR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(7, 11, 20, 0.94)';
            ctx.shadowColor = ringColor;
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.strokeStyle = ringColor;
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = ringColor;
            ctx.font = `900 ${fontSize + 2}px 'Vazirmatn', 'Tahoma', sans-serif`;
            ctx.fillText(isDecrypt ? '؟' : '◎', lx, ly + 1);
            ctx.font = `800 ${fontSize}px 'Vazirmatn', 'Tahoma', sans-serif`;
          } else {
            const txt = toPersianDeg(Math.round(w.span));
            const tw = ctx.measureText(txt).width;
            const pillW = tw + 16;
            const pillH = fontSize + 9;

            ctx.fillStyle = 'rgba(7, 11, 20, 0.88)';
            drawRoundedRect(lx - pillW * 0.5, ly - pillH * 0.5, pillW, pillH, 9);
            ctx.fill();

            ctx.strokeStyle = isTarget
              ? '#22d3ee'
              : (isGiven ? '#ffffff' : col.stroke);
            ctx.lineWidth = (isTarget || isGiven) ? 1.8 : 1.1;
            ctx.stroke();

            ctx.fillStyle = col.text;
            ctx.fillText(txt, lx, ly + 1);
          }
        }

        ctx.restore();
      }

      /* =======================================================================
         نمایش بصری الگوی هندسی ۱۸۰° پس از خطا (بدون متن آموزشی)
         ======================================================================= */
      function drawGeometricHintArc() {
        if (hintTimer <= 0 || !hintData || hintData.mode !== 'supp') return;
        const alphaFade = Math.min(1, hintTimer * 1.1);
        const px = hintData.interIdx === 0 ? geom.ix1 : geom.ix2;
        const py = hintData.interIdx === 0 ? geom.y1 : geom.y2;
        const r = geom.sectorR + 13;

        ctx.save();
        ctx.globalAlpha = alphaFade;
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 3.6;
        ctx.shadowColor = '#22d3ee';
        ctx.shadowBlur = 12;
        ctx.setLineDash([8, 5]);
        ctx.beginPath();
        if (hintData.topSide) {
          ctx.arc(px, py, r, -Math.PI, 0, false);
        } else {
          ctx.arc(px, py, r, 0, Math.PI, false);
        }
        ctx.stroke();

        const ly = hintData.topSide ? py - r - 15 : py + r + 15;
        ctx.setLineDash([]);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(7, 11, 20, 0.94)';
        drawRoundedRect(px - 26, ly - 12, 52, 24, 999);
        ctx.fill();
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.font = `900 14px 'Vazirmatn', 'Tahoma', sans-serif`;
        ctx.fillStyle = '#67e8f9';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.direction = 'ltr';
        ctx.fillText(toPersianDeg(180), px, ly + 1);
        ctx.restore();
      }

      /* =======================================================================
         حلقه‌های رادار پالس و جرقه‌های تاکتیکی
         ======================================================================= */
      function updateAndDrawFX(dt) {
        for (let i = radarRings.length - 1; i >= 0; i--) {
          const rr = radarRings[i];
          rr.r += 420 * dt;
          rr.alpha = Math.max(0, 1 - rr.r / rr.maxR);
          if (rr.alpha <= 0.01) {
            radarRings.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.beginPath();
          ctx.arc(rr.x, rr.y, rr.r, 0, Math.PI * 2);
          ctx.strokeStyle = rr.color;
          ctx.globalAlpha = rr.alpha;
          ctx.lineWidth = 2.6;
          ctx.stroke();
          ctx.restore();
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const sp = sparks[i];
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.vx *= 0.94;
          sp.vy *= 0.94;
          sp.life -= sp.decay * dt;
          if (sp.life <= 0) {
            sparks.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = sp.life;
          ctx.strokeStyle = sp.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(sp.x, sp.y);
          ctx.lineTo(sp.x - sp.vx * 0.04, sp.y - sp.vy * 0.04);
          ctx.stroke();
          ctx.restore();
        }
      }

      /* =======================================================================
         منطق حالت بقا و رکورد (Endless Rush)
         ======================================================================= */
      function generateRushPhase(waveNum) {
        const worlds = ['highway', 'rail', 'runway'];
        activeWorld = worlds[(waveNum - 1) % worlds.length];

        const isRotate = (waveNum % 2 === 1);
        const blackout = waveNum >= 4;
        const limit = Math.max(9.5, 19 - waveNum * 0.65);

        if (isRotate) {
          const targetDeg = 35 + Math.floor(Math.random() * 23) * 5; // مضرب‌های ۵ بین ۳۵ تا ۱۴۵
          const targetInter = waveNum >= 3 ? 1 : 0;
          const pos = WEDGE_POSITIONS[Math.floor(Math.random() * 4)];
          let startA = 40 + Math.floor(Math.random() * 100);
          if (Math.abs(getWedgeValue(startA, pos) - targetDeg) < 18) {
            startA = startA < 90 ? 132 : 48;
          }
          return {
            type: 'rotate',
            startAlpha: startA,
            targetKey: targetInter + ':' + pos,
            targetDeg,
            numberMask: targetInter === 1 ? 'top' : 'all',
            blackout: waveNum >= 5,
            timeLimit: limit + 3,
            order: `موج ${toPersianNum(waveNum)}: زاویه هدف را روی ${toPersianDeg(targetDeg)} قفل کن`
          };
        } else {
          // انتخاب زاویه غیر ۹۰ درجه برای رمزگشایی جذاب
          let alpha = 35 + Math.floor(Math.random() * 110);
          if (Math.abs(alpha - 90) < 8) alpha = 118;
          const givenInter = Math.random() < 0.5 ? 0 : 1;
          const targetInter = 1 - givenInter;
          const givenPos = WEDGE_POSITIONS[Math.floor(Math.random() * 4)];
          const targetPos = WEDGE_POSITIONS[Math.floor(Math.random() * 4)];
          return {
            type: 'decrypt',
            alpha,
            givenKey: givenInter + ':' + givenPos,
            targetKey: targetInter + ':' + targetPos,
            blackout,
            timeLimit: limit,
            order: `موج ${toPersianNum(waveNum)}: مقدار زاویه (؟) را رمزگشایی کن`
          };
        }
      }

      /* =======================================================================
         مدیریت مراحل، HUD، کیپد و قدرت‌ها
         ======================================================================= */
      function renderShields(repairedIdx = -1) {
        let html = '<span class="shields-wrap">';
        for (let i = 0; i < 3; i++) {
          const cls = i < shields
            ? (i === repairedIdx ? 'shield-cell repaired' : 'shield-cell')
            : 'shield-cell lost';
          html += `<span class="${cls}"><svg width="13" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6c0 5.5 3.4 10.6 8 12 4.6-1.4 8-6.5 8-12V5l-8-3z"/></svg></span>`;
        }
        html += '</span>';
        hudShields.innerHTML = html;
      }

      function updateHUD(repairedIdx = -1) {
        if (appMode === 'campaign') {
          hudStage.textContent = `مرحله ${toPersianNum(stageIdx + 1)} / ${toPersianNum(CAMPAIGN_STAGES.length)}`;
        } else {
          hudStage.textContent = `موج ${toPersianNum(rushWave)}`;
        }
        hudScore.textContent = toPersianNum(score);
        renderShields(repairedIdx);

        const mult = Math.min(5, 1 + Math.floor(combo / 2));
        if (combo >= 2) {
          hudCombo.textContent = `×${toPersianNum(mult)}`;
          hudCombo.classList.remove('hidden');
        } else {
          hudCombo.classList.add('hidden');
        }

        // وضعیت اسکن پالس
        scanChargesBadge.textContent = toPersianNum(scanCharges);
        btnPulseScan.disabled = scanCharges <= 0 || phaseLocked || pulseScanTimer > 0;
        btnPulseScan.classList.toggle('scan-ready', !btnPulseScan.disabled);

        // دکمه اورکلاک ۲× در چالش‌های رمزگشایی و حالت بقا
        const allowOverclock = activePhase && (activePhase.type === 'decrypt' || appMode === 'rush') && !phaseLocked;
        btnOverclock.classList.toggle('hidden', !allowOverclock);
        btnOverclock.classList.toggle('overclock-armed', overclockArmed);
        btnOverclock.disabled = overclockArmed || phaseLocked;
        missionStrip.classList.toggle('overclock-on', overclockArmed);
        overclockVignette.classList.toggle('active', overclockArmed);
      }

      function updateCodeDisplay(isWrong = false) {
        codeDisplay.classList.remove('wrong');
        if (inputBuffer.length === 0) {
          codeDisplay.textContent = '--°';
          codeDisplay.classList.add('empty');
        } else {
          codeDisplay.textContent = toPersianNum(inputBuffer) + '°';
          codeDisplay.classList.remove('empty');
        }
        if (isWrong) codeDisplay.classList.add('wrong');
      }

      function loadPhase(phaseObj) {
        activePhase = Object.assign({}, phaseObj);
        phaseLocked = false;
        revealPhaseSuccess = false;
        overclockArmed = false;
        hintTimer = 0;
        hintData = null;
        inputBuffer = '';
        updateCodeDisplay();

        if (activePhase.type === 'rotate') {
          currentAlpha = activePhase.startAlpha;
          lastTickAlpha = currentAlpha;
          gameSlider.value = String(currentAlpha);
          rotateDock.classList.remove('hidden');
          decryptDock.classList.add('hidden');
        } else {
          if (!activePhase.usePreviousAlpha) {
            currentAlpha = activePhase.alpha;
          }
          rotateDock.classList.add('hidden');
          decryptDock.classList.remove('hidden');
        }

        maxTime = activePhase.timeLimit;
        timeLeft = maxTime;
        missionText.textContent = activePhase.order;
        missionStrip.classList.remove('success-hit');
        updateHUD();
        updateGeometry();
      }

      function startCampaign() {
        Synth.key();
        appMode = 'campaign';
        lastPlayMode = 'campaign';
        stageIdx = 0;
        phaseIdx = 0;
        score = 0;
        shields = 3;
        combo = 0;
        maxCombo = 1;
        streakForScan = 0;
        scanCharges = 1;
        totalAttempts = 0;
        correctAttempts = 0;
        pulseScanTimer = 0;
        overdriveTimer = 0;

        startScreen.classList.add('hidden');
        summaryScreen.classList.add('hidden');
        labUI.classList.add('hidden');
        gameUI.classList.remove('hidden');

        activeWorld = CAMPAIGN_STAGES[0].world;
        loadPhase(CAMPAIGN_STAGES[0].phases[0]);
      }

      function startRush() {
        Synth.key();
        appMode = 'rush';
        lastPlayMode = 'rush';
        rushWave = 1;
        score = 0;
        shields = 3;
        combo = 0;
        maxCombo = 1;
        streakForScan = 0;
        scanCharges = 1;
        totalAttempts = 0;
        correctAttempts = 0;
        pulseScanTimer = 0;
        overdriveTimer = 0;

        startScreen.classList.add('hidden');
        summaryScreen.classList.add('hidden');
        labUI.classList.add('hidden');
        gameUI.classList.remove('hidden');

        loadPhase(generateRushPhase(rushWave));
      }

      function openLab() {
        Synth.key();
        appMode = 'lab';
        activePhase = null;
        overclockArmed = false;
        overclockVignette.classList.remove('active');
        pulseScanTimer = 0;
        hintTimer = 0;
        currentAlpha = 115;
        lastTickAlpha = 115;
        labSlider.value = '115';
        setLabSweep(false);

        startScreen.classList.add('hidden');
        summaryScreen.classList.add('hidden');
        gameUI.classList.add('hidden');
        labUI.classList.remove('hidden');

        labWorldButtons.forEach(function (b) {
          b.classList.toggle('active', b.dataset.world === activeWorld);
        });
        updateGeometry();
      }

      function openStartMenu() {
        Synth.key();
        appMode = 'start';
        activeWorld = 'highway';
        activePhase = null;
        overclockArmed = false;
        overclockVignette.classList.remove('active');
        setLabSweep(false);

        startBestScore.textContent = toPersianNum(bestScore);
        startScreen.classList.remove('hidden');
        summaryScreen.classList.add('hidden');
        gameUI.classList.add('hidden');
        labUI.classList.add('hidden');
        updateGeometry();
      }

      function openSummary(isVictory) {
        appMode = 'summary';
        overclockArmed = false;
        overclockVignette.classList.remove('active');
        saveBestScore(score);

        gameUI.classList.add('hidden');
        summaryScreen.classList.remove('hidden');

        const acc = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 100;
        statScore.textContent = toPersianNum(score);
        statBest.textContent = toPersianNum(bestScore);
        statCombo.textContent = `×${toPersianNum(Math.min(5, 1 + Math.floor(maxCombo / 2)))}`;
        statAccuracy.textContent = `${toPersianNum(acc)}٪`;

        summaryRankOrb.className = 'rank-orb';
        if (!isVictory && lastPlayMode === 'campaign') {
          summaryRankOrb.classList.add('rank-fail');
          summaryRankOrb.textContent = '✕';
          summaryTitle.textContent = 'سپر سیستم از کار افتاد';
          summarySub.textContent = 'عملیات متوقف شد — آماده تلاش مجدد';
        } else {
          let rank = 'B';
          let sub = 'اپراتور تاکتیکی تقاطع';
          if (acc >= 92 && score >= 1200) {
            rank = 'S';
            sub = 'فرمانده ارشد پروتکل تقاطع';
            summaryRankOrb.classList.add('rank-s');
          } else if (acc >= 75) {
            rank = 'A';
            sub = 'مهندس ویژه شبکه مسیرها';
          }
          summaryRankOrb.textContent = rank;
          summaryTitle.textContent = lastPlayMode === 'rush' ? 'پایان رکوردگیری' : 'پروتکل تکمیل شد';
          summarySub.textContent = sub;
        }
      }

      function advanceAfterPhaseWin() {
        if (appMode === 'campaign') {
          const stage = CAMPAIGN_STAGES[stageIdx];
          if (phaseIdx + 1 < stage.phases.length) {
            phaseIdx += 1;
            loadPhase(stage.phases[phaseIdx]);
          } else if (stageIdx + 1 < CAMPAIGN_STAGES.length) {
            stageIdx += 1;
            phaseIdx = 0;
            activeWorld = CAMPAIGN_STAGES[stageIdx].world;
            loadPhase(CAMPAIGN_STAGES[stageIdx].phases[0]);
          } else {
            Synth.victory();
            openSummary(true);
          }
        } else if (appMode === 'rush') {
          rushWave += 1;
          loadPhase(generateRushPhase(rushWave));
        }
      }

      function handlePhaseSuccess(isCritical) {
        phaseLocked = true;
        revealPhaseSuccess = true;
        totalAttempts += 1;
        correctAttempts += 1;
        combo += 1;
        if (combo > maxCombo) maxCombo = combo;

        // شارژ اسکن پالس هر ۲ پاسخ متوالی درست
        streakForScan += 1;
        if (streakForScan >= 2) {
          streakForScan = 0;
          if (scanCharges < 3) scanCharges += 1;
        }

        const mult = Math.min(5, 1 + Math.floor(combo / 2));
        const speedBonus = Math.round((timeLeft / Math.max(1, maxTime)) * 60);
        const critBonus = isCritical ? 80 : 0;
        let gained = (120 + speedBonus + critBonus) * mult;

        let repairedIdx = -1;
        if (overclockArmed) {
          gained *= 2;
          if (shields < 3) {
            repairedIdx = shields;
            shields += 1;
          }
        }

        score += gained;
        saveBestScore(score);
        missionStrip.classList.add('success-hit');

        Synth.lock(isCritical || overclockArmed, combo);
        spawnRadarRing(geom.ix1, geom.y1, isCritical ? '#22d3ee' : '#a3e635', 160);
        spawnRadarRing(geom.ix2, geom.y2, isCritical ? '#22d3ee' : '#a3e635', 160);
        spawnSparks(geom.ix1, geom.y1, isCritical ? '#22d3ee' : '#a3e635', 16);
        spawnSparks(geom.ix2, geom.y2, isCritical ? '#22d3ee' : '#a3e635', 16);

        if (isCritical || overclockArmed) {
          overdriveTimer = 1.9;
        }

        const label = overclockArmed
          ? `اورکلاک موفق! +${toPersianNum(gained)}`
          : (isCritical ? `قفل بحرانی ۰°! +${toPersianNum(gained)}` : `تأیید شد +${toPersianNum(gained)}`);
        showToast(label, (isCritical || overclockArmed) ? 'crit' : 'ok');

        updateHUD(repairedIdx);

        setTimeout(function () {
          if (appMode === 'campaign' || appMode === 'rush') {
            advanceAfterPhaseWin();
          }
        }, 1050);
      }

      function triggerDecryptVisualHint() {
        if (!activePhase || activePhase.type !== 'decrypt') return;
        const gParts = activePhase.givenKey.split(':');
        const tParts = activePhase.targetKey.split(':');
        const givenVal = getWedgeValue(currentAlpha, gParts[1]);
        const targetVal = getWedgeValue(currentAlpha, tParts[1]);

        if (givenVal === targetVal) {
          hintData = { mode: 'equal', targetSpan: targetVal };
        } else {
          const gInter = Number(gParts[0]);
          const gPos = gParts[1];
          hintData = {
            mode: 'supp',
            interIdx: gInter,
            topSide: (gPos === 'TL' || gPos === 'TR')
          };
        }
        hintTimer = 1.85;
      }

      function handlePhaseMistake(isTimeout) {
        totalAttempts += 1;
        combo = 0;
        streakForScan = 0;
        shields = Math.max(0, shields - 1);

        Synth.error();
        triggerScreenAlert();
        spawnSparks(geom.ix1, geom.y1, '#f43f5e', 14);
        spawnSparks(geom.ix2, geom.y2, '#f43f5e', 14);

        if (activePhase && activePhase.type === 'decrypt') {
          triggerDecryptVisualHint();
          inputBuffer = '';
          updateCodeDisplay(true);
        }

        updateHUD();

        if (shields <= 0) {
          phaseLocked = true;
          showToast('سپر سیستم شکست!', 'err');
          setTimeout(function () {
            openSummary(false);
          }, 750);
          return;
        }

        if (isTimeout) {
          showToast('پایان زمان!', 'err');
          // بازنشانی زمان همان مرحله (یا موج جدید در حالت بقا)
          overclockArmed = false;
          timeLeft = activePhase.timeLimit;
          maxTime = activePhase.timeLimit;
          updateHUD();
        } else {
          showToast('خطای زاویه — سپر ۱−', 'err');
        }
      }

      function submitRotateLock() {
        if (!activePhase || activePhase.type !== 'rotate' || phaseLocked) return;
        const pos = activePhase.targetKey.split(':')[1];
        const currentVal = getWedgeValue(currentAlpha, pos);
        const diff = Math.abs(currentVal - activePhase.targetDeg);

        if (diff === 0) {
          handlePhaseSuccess(true);
        } else if (diff === 1) {
          handlePhaseSuccess(false);
        } else {
          handlePhaseMistake(false);
        }
      }

      function submitDecryptCode() {
        if (!activePhase || activePhase.type !== 'decrypt' || phaseLocked) return;
        if (inputBuffer.length === 0) return;

        const entered = Number(inputBuffer);
        const targetPos = activePhase.targetKey.split(':')[1];
        const correct = getWedgeValue(currentAlpha, targetPos);

        if (entered === correct) {
          handlePhaseSuccess(timeLeft / Math.max(1, maxTime) > 0.6);
        } else {
          handlePhaseMistake(false);
        }
      }

      function triggerPulseScan() {
        if (appMode !== 'campaign' && appMode !== 'rush') return;
        if (scanCharges <= 0 || phaseLocked || pulseScanTimer > 0) return;
        scanCharges -= 1;
        pulseScanTimer = 2.5;
        Synth.sonar();
        spawnRadarRing(geom.ix1, geom.y1, '#22d3ee', Math.max(width, height) * 0.52);
        spawnRadarRing(geom.ix2, geom.y2, '#22d3ee', Math.max(width, height) * 0.52);
        showToast('اسکن پالس فعال شد', 'crit');
        updateHUD();
      }

      function triggerOverclock() {
        if (appMode !== 'campaign' && appMode !== 'rush') return;
        if (!activePhase || overclockArmed || phaseLocked) return;
        overclockArmed = true;
        timeLeft = Math.max(3.5, timeLeft * 0.5);
        maxTime = Math.max(timeLeft, maxTime * 0.5);
        Synth.overclock();
        showToast('اورکلاک ۲× فعال!', 'err');
        updateHUD();
      }

      /* =======================================================================
         ساخت کیپد عددی تاکتیکی (۰ تا ۹ فارسی)
         ======================================================================= */
      function buildNumpad() {
        numKeyRow.innerHTML = '';
        const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        digits.forEach(function (d) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'num-key';
          btn.textContent = toPersianNum(d);
          btn.addEventListener('click', function () {
            appendDigit(d);
          });
          numKeyRow.appendChild(btn);
        });
      }

      function appendDigit(d) {
        if (!activePhase || activePhase.type !== 'decrypt' || phaseLocked) return;
        if (inputBuffer.length >= 3) return;
        Synth.key();
        inputBuffer += d;
        updateCodeDisplay();
      }

      function backspaceDigit() {
        if (!activePhase || activePhase.type !== 'decrypt' || phaseLocked) return;
        if (inputBuffer.length === 0) return;
        Synth.key();
        inputBuffer = inputBuffer.slice(0, -1);
        updateCodeDisplay();
      }

      /* =======================================================================
         حلقه اصلی ۶۰ فریم بر ثانیه
         ======================================================================= */
      function updateTimerHUD(dt) {
        if ((appMode !== 'campaign' && appMode !== 'rush') || !activePhase || phaseLocked) return;

        timeLeft = Math.max(0, timeLeft - dt);
        const ratio = Math.max(0, Math.min(1, timeLeft / Math.max(0.1, maxTime)));

        missionTimerNum.textContent = timeLeft.toFixed(1) + 's';
        timerFill.style.transform = `scaleX(${ratio})`;

        const isUrgent = timeLeft <= 4.5;
        const isWarn = !isUrgent && ratio <= 0.45;
        missionTimerNum.classList.toggle('urgent', isUrgent);
        timerFill.classList.toggle('urgent', isUrgent);
        timerFill.classList.toggle('warn', isWarn);

        if (timeLeft <= 0) {
          handlePhaseMistake(true);
        }
      }

      function frame(now) {
        if (!lastFrameTime) lastFrameTime = now;
        const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;
        elapsedTime += dt;

        if (pulseScanTimer > 0) {
          pulseScanTimer = Math.max(0, pulseScanTimer - dt);
          if (pulseScanTimer === 0 && (appMode === 'campaign' || appMode === 'rush')) {
            updateHUD();
          }
        }
        if (overdriveTimer > 0) overdriveTimer = Math.max(0, overdriveTimer - dt);
        if (hazardFlashTimer > 0) hazardFlashTimer = Math.max(0, hazardFlashTimer - dt);
        if (hintTimer > 0) hintTimer = Math.max(0, hintTimer - dt);

        // چرخش خودکار در آزمایشگاه آزاد یا حرکت بسیار ملایم در صفحه شروع
        if (appMode === 'lab' && labSweep) {
          let nextA = currentAlpha + labSweepDir * SWEEP_SPEED * dt;
          if (nextA >= 145) { nextA = 145; labSweepDir = -1; }
          else if (nextA <= 35) { nextA = 35; labSweepDir = 1; }
          currentAlpha = nextA;
          labSlider.value = String(Math.round(currentAlpha));
        } else if (appMode === 'start') {
          currentAlpha = 115 + Math.sin(elapsedTime * 0.42) * 18;
        }

        updateTimerHUD(dt);
        updateGeometry();

        const speedMult = overdriveTimer > 0 ? 1.85 : 1;
        if (activeWorld === 'highway') {
          renderHighwayWorld(dt, speedMult);
        } else if (activeWorld === 'rail') {
          renderRailWorld(dt, speedMult);
        } else {
          renderRunwayWorld(dt, speedMult);
        }

        // خطوط و زاویه‌ها همیشه روی بالاترین لایه
        drawTacticalMathLines();
        drawIntersectionOverlay(0, geom.ix1, geom.y1, currentAlpha);
        drawIntersectionOverlay(1, geom.ix2, geom.y2, currentAlpha);
        drawGeometricHintArc();
        updateAndDrawFX(dt);

        requestAnimationFrame(frame);
      }

      /* =======================================================================
         کنترل چرخش خط مورب (لغزنده + کشیدن مستقیم ماوس و لمس + کیبورد)
         ======================================================================= */
      function setAlphaControl(val, withSound) {
        const clamped = Math.max(MIN_ALPHA, Math.min(MAX_ALPHA, Math.round(val)));
        currentAlpha = clamped;
        gameSlider.value = String(clamped);
        labSlider.value = String(clamped);
        if (withSound && clamped !== lastTickAlpha) {
          lastTickAlpha = clamped;
          Synth.tick();
        }
      }

      function setLabSweep(playing) {
        labSweep = playing;
        btnLabSweep.classList.toggle('active', labSweep);
        iconPlay.style.display = labSweep ? 'none' : 'block';
        iconPause.style.display = labSweep ? 'block' : 'none';
      }

      function getPointerCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function isNearTransversal(px, py) {
        if (!canRotateNow()) return false;
        const dx = px - geom.cx;
        const dy = py - geom.cy;
        if (Math.hypot(dx, dy) < 12) return false;
        const rad = currentAlpha * DEG_TO_RAD;
        const perpDist = Math.abs(dx * Math.sin(rad) + dy * Math.cos(rad));
        return perpDist <= 46;
      }

      function updateAlphaFromPointer(px, py) {
        const dx = px - geom.cx;
        const dy = py - geom.cy;
        if (Math.hypot(dx, dy) < 12) return;

        // فرمول دقیق و پیوسته برای نیمه بالا و نیمه پایین بدون پرش زاویه
        let rad;
        if (py <= geom.cy) {
          rad = Math.atan2(geom.cy - py, px - geom.cx);
        } else {
          rad = Math.atan2(py - geom.cy, geom.cx - px);
        }
        const deg = rad * RAD_TO_DEG;
        setAlphaControl(deg, true);
      }

      canvas.addEventListener('pointerdown', function (e) {
        const pt = getPointerCoords(e);
        if (!isNearTransversal(pt.x, pt.y)) return;
        Synth.init();
        if (labSweep) setLabSweep(false);
        isDragging = true;
        canvas.classList.add('dragging');
        if (canvas.setPointerCapture && e.pointerId !== undefined) {
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        }
        updateAlphaFromPointer(pt.x, pt.y);
      });

      window.addEventListener('pointermove', function (e) {
        const pt = getPointerCoords(e);
        if (isDragging) {
          updateAlphaFromPointer(pt.x, pt.y);
        } else {
          canvas.classList.toggle('can-grab', isNearTransversal(pt.x, pt.y));
        }
      });

      function stopDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        canvas.classList.remove('dragging');
        if (canvas.releasePointerCapture && e.pointerId !== undefined) {
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }

      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);

      /* =======================================================================
         اتصال رویدادهای دکمه‌ها و کیبورد
         ======================================================================= */
      btnModeCampaign.addEventListener('click', startCampaign);
      btnModeRush.addEventListener('click', startRush);
      btnModeLab.addEventListener('click', openLab);

      btnSummaryReplay.addEventListener('click', function () {
        if (lastPlayMode === 'rush') startRush();
        else startCampaign();
      });
      btnSummaryRush.addEventListener('click', startRush);
      btnSummaryLab.addEventListener('click', openLab);

      btnHudMenu.addEventListener('click', openStartMenu);
      btnLabMenu.addEventListener('click', openStartMenu);

      btnSound.addEventListener('click', function () {
        Synth.enabled = !Synth.enabled;
        iconSoundOn.style.display = Synth.enabled ? 'block' : 'none';
        iconSoundOff.style.display = Synth.enabled ? 'none' : 'block';
        if (Synth.enabled) Synth.key();
      });

      gameSlider.addEventListener('input', function () {
        if (!canRotateNow()) return;
        setAlphaControl(Number(gameSlider.value), true);
      });

      btnAngleMinus.addEventListener('click', function () {
        if (!canRotateNow()) return;
        setAlphaControl(currentAlpha - 1, true);
      });

      btnAnglePlus.addEventListener('click', function () {
        if (!canRotateNow()) return;
        setAlphaControl(currentAlpha + 1, true);
      });

      btnLockAngle.addEventListener('click', submitRotateLock);
      btnBksp.addEventListener('click', backspaceDigit);
      btnSubmitCode.addEventListener('click', submitDecryptCode);
      btnPulseScan.addEventListener('click', triggerPulseScan);
      btnOverclock.addEventListener('click', triggerOverclock);

      labSlider.addEventListener('input', function () {
        if (labSweep) setLabSweep(false);
        setAlphaControl(Number(labSlider.value), true);
      });

      btnLabSweep.addEventListener('click', function () {
        Synth.key();
        setLabSweep(!labSweep);
      });

      labWorldButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          Synth.key();
          activeWorld = btn.dataset.world;
          labWorldButtons.forEach(function (b) {
            b.classList.toggle('active', b.dataset.world === activeWorld);
          });
        });
      });

      btnLabNumbers.addEventListener('click', function () {
        Synth.key();
        labShowNumbers = !labShowNumbers;
        btnLabNumbers.classList.toggle('active', labShowNumbers);
      });

      btnLabColors.addEventListener('click', function () {
        Synth.key();
        labShowColors = !labShowColors;
        btnLabColors.classList.toggle('active', labShowColors);
      });

      function updateFsIcon() {
        const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        iconFsEnter.style.display = isFs ? 'none' : 'block';
        iconFsExit.style.display = isFs ? 'block' : 'none';
      }

      btnFullscreen.addEventListener('click', function () {
        try {
          const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
          if (!isFs) {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        } catch (_) {}
      });

      document.addEventListener('fullscreenchange', updateFsIcon);
      document.addEventListener('webkitfullscreenchange', updateFsIcon);

      // پشتیبانی کامل کیبورد (ارقام انگلیسی و فارسی، جهت‌ها/A-D با Shift، Enter، Backspace، Space و Q)
      window.addEventListener('keydown', function (e) {
        const step = e.shiftKey ? 5 : 1;

        if (appMode === 'lab') {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            if (labSweep) setLabSweep(false);
            setAlphaControl(currentAlpha - step, true);
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            if (labSweep) setLabSweep(false);
            setAlphaControl(currentAlpha + step, true);
          } else if (e.key === ' ') {
            e.preventDefault();
            setLabSweep(!labSweep);
          }
          return;
        }

        if ((appMode === 'campaign' || appMode === 'rush') && activePhase && !phaseLocked) {
          if (e.key === 'q' || e.key === 'Q' || e.key === 'ض') {
            triggerPulseScan();
            return;
          }

          if (activePhase.type === 'rotate') {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
              setAlphaControl(currentAlpha - step, true);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
              setAlphaControl(currentAlpha + step, true);
            } else if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              submitRotateLock();
            }
          } else if (activePhase.type === 'decrypt') {
            const digit = normalizeDigitChar(e.key);
            if (digit !== null) {
              appendDigit(digit);
            } else if (e.key === 'Backspace') {
              e.preventDefault();
              backspaceDigit();
            } else if (e.key === 'Enter') {
              e.preventDefault();
              submitDecryptCode();
            } else if (e.key === ' ') {
              e.preventDefault();
              triggerPulseScan();
            }
          }
        }
      });

      window.addEventListener('resize', resizeCanvas);

      /* =======================================================================
         راه‌اندازی نهایی پس از بارگذاری کامل صفحه
         ======================================================================= */
      window.onload = function () {
        buildNumpad();
        startBestScore.textContent = toPersianNum(bestScore);
        resizeCanvas();
        requestAnimationFrame(frame);
      };
    })();
  </script>
