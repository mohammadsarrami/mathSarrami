<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی تقسیم کسرها - کلاس آقای صرامی</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in;
            z-index: 0;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .scoreboard {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 30px;
            border-radius: 20px;
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00695c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10;
            display: flex;
            gap: 20px;
        }

        .score-val {
            color: #d32f2f;
            font-size: 1.8rem;
            min-width: 50px;
            text-align: center;
        }

        .game-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .seaweed-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .seaweed {
            width: 120px;
            height: 350px;
            background: #4CAF50;
            border-radius: 50px 50px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-origin: bottom center;
            animation: sway 4s infinite ease-in-out;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.2);
        }

        .question-box {
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0, 100, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            transform: rotate(-90deg);
            width: 200px;
            text-align: center;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); }
        }

        .frogs-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .frog-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            pointer-events: auto;
        }

        .frog-container:hover {
            transform: scale(1.1);
        }

        .frog-container:active {
            transform: scale(0.95);
        }

        .frog-1 { top: 20%; left: 10%; }
        .frog-2 { top: 15%; right: 10%; }
        .frog-3 { bottom: 20%; left: 15%; } 
        
        @media (max-width: 600px) {
            .frog-1 { top: 10%; left: 5%; }
            .frog-2 { top: 10%; right: 5%; }
            .frog-3 { bottom: 30%; right: 5%; }
            .seaweed { height: 250px; width: 100px; }
            .question-box { font-size: 1.5rem; width: 150px;}
        }

        .frog-img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }

        .answer-board {
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 5px 15px;
            margin-top: -20px;
            font-size: 1.5rem;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            z-index: 3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .designer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255, 0.8);
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 20;
        }

        .shake {
            animation: shake 0.5s;
            animation-iteration-count: 1;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        
        .feedback-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: gold;
            text-shadow: 0 0 10px #ff0000;
            display: none;
            z-index: 100;
            animation: popIn 0.5s ease-out;
            white-space: nowrap;
        }
        
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            80% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

    </style>
</head>
<body>

    <div class="scoreboard">
        <span>امتیاز شما:</span>
        <span class="score-val" id="score">0</span>
    </div>

    <div class="game-container">
        
        <!-- جلبک و سوال -->
        <div class="seaweed-container">
            <div class="seaweed">
                <div class="question-box" id="question">
                    <!-- سوال -->
                </div>
            </div>
        </div>

        <!-- قورباغه ها -->
        <div class="frogs-wrapper">
            <div class="frog-container frog-1" onclick="checkAnswer(0)">
                <svg class="frog-img" viewBox="0 0 100 100">
                    <path d="M20,70 Q10,60 20,50 Q30,30 50,30 Q70,30 80,50 Q90,60 80,70 Q90,80 95,90 Q80,95 70,85 Q60,95 40,95 Q30,85 20,90 Q10,80 20,70 Z" fill="#66bb6a"/>
                    <circle cx="35" cy="45" r="5" fill="white"/>
                    <circle cx="35" cy="45" r="2" fill="black"/>
                    <circle cx="65" cy="45" r="5" fill="white"/>
                    <circle cx="65" cy="45" r="2" fill="black"/>
                    <path d="M40,60 Q50,70 60,60" fill="none" stroke="black" stroke-width="2"/>
                    <ellipse cx="15" cy="50" rx="5" ry="3" fill="#ff8a65" opacity="0.6"/>
                    <ellipse cx="85" cy="50" rx="5" ry="3" fill="#ff8a65" opacity="0.6"/>
                </svg>
                <div class="answer-board" id="ans-0"></div>
            </div>

            <div class="frog-container frog-2" onclick="checkAnswer(1)">
                <svg class="frog-img" viewBox="0 0 100 100">
                    <path d="M20,70 Q10,60 20,50 Q30,30 50,30 Q70,30 80,50 Q90,60 80,70 Q90,80 95,90 Q80,95 70,85 Q60,95 40,95 Q30,85 20,90 Q10,80 20,70 Z" fill="#81c784"/>
                    <circle cx="35" cy="45" r="5" fill="white"/>
                    <circle cx="35" cy="45" r="2" fill="black"/>
                    <circle cx="65" cy="45" r="5" fill="white"/>
                    <circle cx="65" cy="45" r="2" fill="black"/>
                    <path d="M40,60 Q50,70 60,60" fill="none" stroke="black" stroke-width="2"/>
                </svg>
                <div class="answer-board" id="ans-1"></div>
            </div>

            <div class="frog-container frog-3" onclick="checkAnswer(2)">
                <svg class="frog-img" viewBox="0 0 100 100">
                    <path d="M20,70 Q10,60 20,50 Q30,30 50,30 Q70,30 80,50 Q90,60 80,70 Q90,80 95,90 Q80,95 70,85 Q60,95 40,95 Q30,85 20,90 Q10,80 20,70 Z" fill="#4caf50"/>
                    <circle cx="35" cy="45" r="5" fill="white"/>
                    <circle cx="35" cy="45" r="2" fill="black"/>
                    <circle cx="65" cy="45" r="5" fill="white"/>
                    <circle cx="65" cy="45" r="2" fill="black"/>
                    <path d="M40,60 Q50,70 60,60" fill="none" stroke="black" stroke-width="2"/>
                </svg>
                <div class="answer-board" id="ans-2"></div>
            </div>
        </div>
    </div>
    
    <div class="feedback-msg" id="feedback">آفرین! +3</div>

    <div class="designer">طراح: آقای صرامی</div>

    <script>
        let score = 0;
        let currentCorrectIndex = 0;
        let isWaiting = false; 
        let attemptMade = false; // متغیر جدید برای بررسی اینکه آیا اولین تلاش انجام شده یا خیر

        function gcd(a, b) {
            return b == 0 ? a : gcd(b, a % b);
        }

        function simplifyFraction(num, den) {
            let common = gcd(num, den);
            return { n: num / common, d: den / common };
        }

        function toLatex(num, den) {
            if(den === 1) return `$$ ${num} $$`;
            return `$$ \\frac{${num}}{${den}} $$`;
        }

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function newLevel() {
            isWaiting = false;
            attemptMade = false; // ریست کردن وضعیت تلاش برای سوال جدید
            document.getElementById('feedback').style.display = 'none';

            let n1 = rand(1, 8);
            let d1 = rand(2, 9);
            let n2 = rand(1, 8);
            let d2 = rand(2, 9);

            while (d1 === d2) {
                d2 = rand(2, 9);
            }

            const questionLatex = `$$ \\frac{${n1}}{${d1}} \\div \\frac{${n2}}{${d2}} $$`;
            document.getElementById('question').innerHTML = questionLatex;

            let resNum = n1 * d2;
            let resDen = d1 * n2;
            let correct = simplifyFraction(resNum, resDen);

            let w1 = simplifyFraction(resDen, resNum); 
            if (w1.n === correct.n && w1.d === correct.d) {
                w1 = simplifyFraction(resNum + 1, resDen);
            }
            let wrong1 = w1;

            let w2RawN = n1 * n2;
            let w2RawD = d1 * d2;
            let w2 = simplifyFraction(w2RawN, w2RawD);
            while ((w2.n === correct.n && w2.d === correct.d) || (w2.n === wrong1.n && w2.d === wrong1.d)) {
                 w2 = simplifyFraction(rand(1, 20), rand(2, 20));
            }
            let wrong2 = w2;

            let answers = [correct, wrong1, wrong2];
            let indices = [0, 1, 2];
            indices.sort(() => Math.random() - 0.5);

            for(let i=0; i<3; i++) {
                let ans = answers[indices[i]];
                document.getElementById(`ans-${i}`).innerHTML = toLatex(ans.n, ans.d);
                if(ans.n === correct.n && ans.d === correct.d) {
                    currentCorrectIndex = i;
                }
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function checkAnswer(index) {
            if (isWaiting) return; 

            const frog = document.querySelector(`.frog-container:nth-child(${index + 1})`);
            const feedback = document.getElementById('feedback');
            
            if (index === currentCorrectIndex) {
                // پاسخ صحیح
                if (!attemptMade) {
                    // اگر اولین تلاش بود و صحیح بود، امتیاز بگیرد
                    score += 3;
                    document.getElementById('score').innerText = score;
                    feedback.innerText = "آفرین! +3";
                } else {
                    // اگر قبلا غلط زده بود، حالا که درست زد فقط تشویق شود، امتیاز نگیرد
                    feedback.innerText = "آفرین!";
                }
                
                feedback.style.color = "gold";
                feedback.style.display = 'block';
                
                isWaiting = true;
                setTimeout(newLevel, 1500);
            } else {
                // پاسخ غلط
                if (!attemptMade) {
                    // فقط اگر اولین بار است که غلط میزند امتیاز کم شود
                    score -= 2;
                    document.getElementById('score').innerText = score;
                    attemptMade = true; // ثبت اینکه اولین تلاش انجام شد
                }
                // در تلاش‌های بعدیِ غلط، امتیاز کم نمی‌شود، فقط لرزش دارد

                frog.classList.add('shake');
                setTimeout(() => {
                    frog.classList.remove('shake');
                }, 500);
            }
        }

        window.onload = function() {
            newLevel();
            createBubbles();
        };

        function createBubbles() {
            for(let i=0; i<10; i++) {
                let b = document.createElement('div');
                b.className = 'bubble';
                b.style.width = Math.random() * 50 + 20 + 'px';
                b.style.height = b.style.width;
                b.style.left = Math.random() * 100 + 'vw';
                b.style.animationDuration = Math.random() * 5 + 5 + 's';
                b.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(b);
            }
        }

    </script>
</body>
</html>
